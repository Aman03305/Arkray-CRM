# Arkray CRM: who may connect to the production-shaped stack's PostgreSQL, and from where
# (infrastructure/compose.production.yml mounts this as hba_file; adversarial review of
# 73ff1e3, M4). The image's own file ends in `host all all all scram-sha-256`: any container
# that knew the superuser's password could connect as the superuser and rewrite the audit
# trail. The first line that matches a connection decides it:
#
#   - the superuser (`arkray`, POSTGRES_USER) only on the server's local socket: inside the
#     PostgreSQL container (`docker compose exec postgres ...`) and the one-shot role setup
#     (db-roles), the only other container that mounts the socket's volume. That includes
#     physical replication (pg_basebackup, and pgBackRest or WAL-G running beside the server
#     in its container: `pg1-user=arkray` / `PGUSER=arkray` with a .pgpass;
#     docs/runbooks.md#database-backup); nobody replicates over the network;
#   - the schema owner (`arkray_owner`) only over TLS, only from `db-owner`, an internal
#     network with this fixed subnet that only the migrate job (and a one-off backup or
#     restore container an operator attaches to it) joins: migrations, grant_app_privileges,
#     replay_erasures, backups and restores;
#   - the application role (`arkray_app`) only over TLS, from the networks the server is on
#     (`samenet`: the API, the workers and beat on `default`);
#   - both only to the application's database, `arkray`, and to `arkray_restored`, the one
#     name a dump is restored into before it is renamed into place
#     (docs/runbooks.md#restore-from-backup; review round 1, INFRA-1: the restore had nowhere
#     to go). Any other database, the superuser's `postgres` included, refuses them;
#   - SCRAM everywhere (the server stores SCRAM verifiers: password_encryption);
#   - everything else rejected: another role, another database, plain TCP, any other address,
#     replication from anywhere but the socket.
#
# A change here takes effect on `SELECT pg_reload_conf();` (the superuser, on the socket:
# `docker compose ... exec postgres psql -U arkray -d postgres -c 'SELECT pg_reload_conf()'`),
# without a restart. A managed database has no pg_hba.conf of its own to edit: there the same
# rules are the provider's network rules (the administrator's account reachable from the
# provisioning host only) and the roles roles.sql creates (docs/deployment.md#database).
#
# TYPE   DATABASE                USER          ADDRESS           METHOD
local    all                     arkray                          scram-sha-256
local    replication             arkray                          scram-sha-256
hostssl  arkray,arkray_restored  arkray_owner  10.252.17.16/28   scram-sha-256
hostssl  arkray,arkray_restored  arkray_app    samenet           scram-sha-256
local    all                     all                             reject
local    replication             all                             reject
host     all                     all           all               reject
host     replication             all           all               reject
