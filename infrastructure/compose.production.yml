# Arkray CRM: a production-shaped stack on one machine. Phase 11 verifies the release with
# it; it is also the reference for real manifests (docs/deployment.md). Unlike the
# development stack it runs exactly as production must: HTTPS at an nginx edge (a
# self-signed certificate here), secure __Host- cookies and HSTS, the two database roles
# (migrations as the owner, everything else as an application role the web server and
# workers check at start), Redis with a password, no insecure opt-in, read-only containers,
# and only the proxy published. Every backend hop uses verified TLS (privacy remediation
# P2-1): PostgreSQL with sslmode=verify-full, the broker and a separate, non-persistent cache
# over rediss:// with certificate checks, SMTP with STARTTLS, all against a private CA the
# `backend-tls` job makes (each server reads only its own key; clients get only the CA).
#
# Least privilege everywhere (R128): every container, the data services included, runs with
# a read-only root filesystem (writable tmpfs only where a process writes), no Linux
# capabilities beyond the few its entrypoint needs (none for most: PostgreSQL, Redis and
# Mailpit run as their own users from the start), no privilege escalation, a memory, CPU
# and process limit, and a health check (the one-shot jobs exit instead). Attachments are
# scanned by a ClamAV daemon only the scanning worker can reach (R94).
#
#   scripts/init-prod-env.sh /secure/arkray-prod.env     # once: every secret generated, 0600
#   scripts/prod-compose.sh /secure/arkray-prod.env up -d --build
#   (docker compose --env-file <file> -p arkray-prod -f docker-compose.yml -f this file
#    --profile app, every ARKRAY_PROD_* unset first: an exported one wins over the file)
#   open https://localhost:8443   (Mailpit's inbox: http://localhost:58125)
#
# Secrets (adversarial review of 73ff1e3, M4): only under production-only names,
# ARKRAY_PROD_* (config/credentials.py lists them), which no development file defines, read
# from the file `--env-file` names: Compose then never reads the repository's `.env` (with
# `.env.example`'s published superuser password, the stack once started on it). Nothing
# starts until `credential-guard` has refused development, placeholder, weak and reused
# values. PostgreSQL reads infrastructure/postgres/pg_hba.conf: the superuser only on its
# local socket (the role setup's), arkray_owner only from `db-owner` (the migrate job's
# network), arkray_app over TLS, SCRAM everywhere, everything else rejected.
#
# A separate project (-p) with its own volumes: it never touches the development stack.
# The limits suit this rehearsal and a small organisation's single host; size real ones from
# docs/capacity.md.

x-production-env: &production-env
  # Every secret under its production-only name (the development file's DJANGO_SECRET_KEY,
  # POSTGRES_PASSWORD, METRICS_TOKEN and ERASURE_LEDGER_KEY never reach these containers).
  DJANGO_SECRET_KEY: ${ARKRAY_PROD_DJANGO_SECRET_KEY:?set ARKRAY_PROD_DJANGO_SECRET_KEY (scripts/init-prod-env.sh)}
  DJANGO_ALLOW_INSECURE_LOCAL_HTTP: "false"
  DJANGO_SECURE_COOKIES: "true"
  DJANGO_SECURE_SSL_REDIRECT: "true"
  DJANGO_HSTS_SECONDS: "31536000"
  DJANGO_ALLOWED_HOSTS: localhost,backend
  DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost:8443
  APP_BASE_URL: https://localhost:8443
  # One proxy (nginx) appends the client address, and only its own address is believed
  # (adversarial review P2-2): nginx has a fixed address on `api`, an internal network it
  # shares with the API alone, and reaches the API only there. Any other container that
  # connects to gunicorn (the workers share `default` with it) is keyed by its own address,
  # whatever X-Forwarded-For it sends (docs/deployment.md#reverse-proxy).
  TRUSTED_PROXY_COUNT: "1"
  TRUSTED_PROXY_ADDRESSES: "10.252.17.10"
  FORWARDED_ALLOW_IPS: "10.252.17.10"
  TRUST_INCOMING_REQUEST_ID: "true"
  DATABASE_URL: "postgres://arkray_app:${ARKRAY_PROD_DB_APP_PASSWORD:?set ARKRAY_PROD_DB_APP_PASSWORD}@postgres:5432/arkray?sslmode=verify-full&sslrootcert=/tls/ca.crt"
  CELERY_BROKER_URL: "rediss://:${ARKRAY_PROD_REDIS_PASSWORD:?set ARKRAY_PROD_REDIS_PASSWORD}@redis:6379/0?ssl_cert_reqs=required&ssl_ca_certs=/tls/ca.crt"
  # The cache on an instance of its own, never written to disk: rate-limit keys hold client
  # addresses (privacy remediation P3).
  REDIS_CACHE_URL: "rediss://:${ARKRAY_PROD_REDIS_PASSWORD:?set ARKRAY_PROD_REDIS_PASSWORD}@redis-cache:6379/0?ssl_cert_reqs=required&ssl_ca_certs=/tls/ca.crt"
  EMAIL_URL: smtp+tls://mailpit:1025
  EMAIL_TLS_CA_FILE: /tls/ca.crt
  ERASURE_LEDGER_URL: file:///var/lib/arkray/ledger
  ERASURE_LEDGER_KEY: ${ARKRAY_PROD_ERASURE_LEDGER_KEY:?set ARKRAY_PROD_ERASURE_LEDGER_KEY (at least 32 characters)}
  EXPORT_ROOT: /var/lib/arkray/exports
  DB_REQUIRE_RESTRICTED_ROLE: "true"
  # Pinned, not interpolated: Compose reads the repository's .env for this project too, and
  # a developer's AI_ENABLED=false there turned Ask Arkray off on a backend recreated alone
  # (the workers kept it on; 271 notes went unindexed, silently: whole-software audit).
  # tests/architecture/test_compose_production.py keeps every interpolated setting pinned.
  AI_ENABLED: "true"
  AI_LLM_PROVIDER: none
  LOG_LEVEL: INFO
  # Required: the metrics endpoint (and the alerts on it) exists only with a token.
  METRICS_TOKEN: ${ARKRAY_PROD_METRICS_TOKEN:?set ARKRAY_PROD_METRICS_TOKEN (at least 32 characters)}
  # This rehearsal keeps attachments on a private volume (pinned, like every setting here);
  # a real deployment normally points ATTACHMENT_STORAGE=s3 at a private bucket.
  ATTACHMENT_STORAGE: filesystem
  ATTACHMENT_ROOT: /var/lib/arkray/attachments
  # Every upload is scanned by the ClamAV daemon below (R94): files are "being checked"
  # until clean, and only clean files can be downloaded. clamd speaks plain TCP, so its host
  # is named as private (it is reachable only on the `scanner` network, from the worker).
  ATTACHMENT_SCANNER: clamd://clamav:3310
  BACKEND_TLS_PRIVATE_HOSTS: clamav
  # Required in production: invitation and reset emails come from here (a real domain
  # with SPF, DKIM and DMARC in a deployment).
  DEFAULT_FROM_EMAIL: Arkray CRM <no-reply@crm.example.com>

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    # Debian trixie: no HIGH or CRITICAL finding (Trivy, 2026-10-11) where the bookworm build
    # the development stack keeps (its existing volume's collations come from bookworm's
    # glibc) had 57 fixable ones. Same PostgreSQL 16; the CI service container matches this.
    image: pgvector/pgvector:0.8.7-pg16-trixie@sha256:40d828eda66737aaacb934387a337babf1455ebd56e9bdd13fc08e211257c972
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: arkray  # the administrator, pinned like every setting (not from .env)
      # No default superuser password here (Phase 11 review), and never the development
      # file's POSTGRES_PASSWORD (M4: `.env.example` publishes it): a production-only name.
      POSTGRES_PASSWORD: ${ARKRAY_PROD_DB_SUPERUSER_PASSWORD:?set ARKRAY_PROD_DB_SUPERUSER_PASSWORD (the superuser's)}
    # Who may connect from where (M4): infrastructure/postgres/pg_hba.conf, not the image's
    # `host all all all scram-sha-256`. The superuser only on the local socket, the owner
    # only from `db-owner`, the application role over TLS; SCRAM verifiers only.
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf", "-c", "password_encryption=scram-sha-256", "-c", "log_min_error_statement=panic", "-c", "log_error_verbosity=terse", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "ssl=on", "-c", "ssl_cert_file=/tls/server.crt", "-c", "ssl_key_file=/tls/server.key", "-c", "ssl_min_protocol_version=TLSv1.2"]
    # As the postgres user from the start (the image supports it): its entrypoint then
    # needs no capability to change owners or switch users (R128).
    user: "999:999"
    read_only: true
    # Every tmpfs in this file has a size (deep security audit H-1): a tmpfs is memory charged
    # to the container, and without `size=` it may grow to half the HOST's memory, whatever
    # the limit below. Sized to what the process writes there, with headroom; at most half of
    # the container's limit together (tests/architecture/test_compose_production.py).
    # PostgreSQL's own temporary files are in its data directory.
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 2g, pids: 512}
    volumes:
      - tls-postgres:/tls:ro
      - ./infrastructure/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      # The socket (and its lock file) on a volume of its own, mounted by the role setup
      # alone (db-roles): the superuser's only way in. A few bytes; the image's ownership.
      - postgres-socket:/var/run/postgresql
    networks:
      - default  # the application role, from the API and the workers
      - db-owner  # the owner, from the migrate job alone
    depends_on:
      credential-guard:
        condition: service_completed_successfully
      backend-tls:
        condition: service_completed_successfully
    ports: !reset []

  redis:
    environment:
      REDIS_PASSWORD: ${ARKRAY_PROD_REDIS_PASSWORD:?set ARKRAY_PROD_REDIS_PASSWORD}
    # TLS only (no plain port): the broker's messages and the password never cross in clear.
    command: ["sh", "-c", "exec redis-server --port 0 --tls-port 6379 --tls-cert-file /tls/server.crt --tls-key-file /tls/server.key --tls-ca-cert-file /tls/ca.crt --tls-auth-clients no --appendonly yes --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    user: "999:1000"  # redis:redis; /data and the TLS key are theirs
    read_only: true
    tmpfs:
      - /tmp:size=8m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512m, pids: 128}
    volumes:
      - tls-redis:/tls:ro
    depends_on:
      credential-guard:
        condition: service_completed_successfully
      backend-tls:
        condition: service_completed_successfully
    healthcheck:
      # The password through the environment, not a command line (`ps`).
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --tls --cacert /tls/ca.crt -h redis ping | grep -q PONG"]
    ports: !reset []

  # The cache (rate limits, breakers, counters): its own instance, nothing persisted
  # (docs/deployment.md#redis), so the client addresses in rate-limit keys never reach disk.
  redis-cache:
    image: redis:8.0-alpine@sha256:5f61955be8ab2ccee9372b84ae4d4da2e2b156f87281e3f218544055e7ee04d4
    logging: *logging
    environment:
      REDIS_PASSWORD: ${ARKRAY_PROD_REDIS_PASSWORD:?set ARKRAY_PROD_REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --port 0 --tls-port 6379 --tls-cert-file /tls/server.crt --tls-key-file /tls/server.key --tls-ca-cert-file /tls/ca.crt --tls-auth-clients no --save '' --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\""]
    user: "999:1000"
    read_only: true
    # Nothing is saved (--save '', no AOF): /data is only its working directory.
    tmpfs:
      - /tmp:size=8m
      - /data:uid=999,gid=1000,size=8m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 384m, pids: 128}
    volumes:
      - tls-redis:/tls:ro
    depends_on:
      credential-guard:
        condition: service_completed_successfully
      backend-tls:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --tls --cacert /tls/ca.crt -h redis-cache ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    environment:
      # STARTTLS required: invitation and reset links never cross in clear.
      MP_SMTP_TLS_CERT: /tls/server.crt
      MP_SMTP_TLS_KEY: /tls/server.key
      MP_SMTP_REQUIRE_STARTTLS: "true"
    user: "65534:65534"  # nobody; backend-tls gives it its key
    read_only: true
    # Its message store (no MP_DATABASE: a SQLite file in /tmp; 500 messages kept at most).
    tmpfs:
      - /tmp:size=48m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128m, pids: 64}
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - tls-mailpit:/tls:ro
    depends_on:
      credential-guard:
        condition: service_completed_successfully
      backend-tls:
        condition: service_completed_successfully
    ports: !override
      - "127.0.0.1:58125:8025"

  # Once: a private CA and a certificate per backend server (names as the clients dial them),
  # each server's key in its own volume, readable by that server's user only, the CA
  # certificate alone in the clients' (tls-ca). The PostgreSQL image's own openssl: nothing
  # is installed at run time (R128: an unpinned `apk add` did that before).
  backend-tls:
    image: pgvector/pgvector:0.8.7-pg16-trixie@sha256:40d828eda66737aaacb934387a337babf1455ebd56e9bdd13fc08e211257c972
    logging: *logging
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp:size=8m
    cap_drop: [ALL]
    cap_add: [CHOWN]  # hands each key to its server's user
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128m, pids: 32}
    entrypoint: []
    volumes:
      - tls-ca:/out/ca
      - tls-postgres:/out/postgres
      - tls-redis:/out/redis
      - tls-mailpit:/out/mailpit
      - tls-ca-key:/out/ca-key
    depends_on:
      credential-guard:
        condition: service_completed_successfully
    command: ["sh", "-c", "[ -f /out/ca/ca.crt ] || (cd /out && openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 30 -subj '/CN=Arkray local backend CA' -keyout ca-key/ca.key -out ca/ca.crt && for s in postgres:postgres redis:redis,redis-cache mailpit:mailpit; do n=$${s%%:*}; sans=$$(echo $${s#*:} | sed 's/[^,]*/DNS:&/g'); openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -subj /CN=$$n -keyout /tmp/$$n.key -out /tmp/$$n.csr && printf 'subjectAltName=%s' $$sans > /tmp/$$n.cnf && openssl x509 -req -in /tmp/$$n.csr -CA ca/ca.crt -CAkey ca-key/ca.key -CAcreateserial -CAserial /tmp/ca.srl -days 30 -extfile /tmp/$$n.cnf -out $$n/server.crt && cp /tmp/$$n.key $$n/server.key && cp ca/ca.crt $$n/ca.crt && rm /tmp/$$n.key /tmp/$$n.csr /tmp/$$n.cnf; done && chmod 600 postgres/server.key redis/server.key mailpit/server.key ca-key/ca.key && chown 999:999 postgres/server.key && chown 999:1000 redis/server.key && chown 65534:65534 mailpit/server.key)"]

  # Once, before anything else (adversarial review of 73ff1e3, M4): every production secret
  # present, none a development or placeholder value, weak, or used twice
  # (config/credentials.py), or nothing starts; it names the variables, never a value. No
  # network: it holds every secret and needs nothing but its environment.
  credential-guard:
    build: ./backend
    logging: *logging
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=8m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128m, pids: 32}
    environment:
      ARKRAY_PROD_DB_SUPERUSER_PASSWORD: ${ARKRAY_PROD_DB_SUPERUSER_PASSWORD:?set ARKRAY_PROD_DB_SUPERUSER_PASSWORD}
      ARKRAY_PROD_DB_OWNER_PASSWORD: ${ARKRAY_PROD_DB_OWNER_PASSWORD:?set ARKRAY_PROD_DB_OWNER_PASSWORD}
      ARKRAY_PROD_DB_APP_PASSWORD: ${ARKRAY_PROD_DB_APP_PASSWORD:?set ARKRAY_PROD_DB_APP_PASSWORD}
      ARKRAY_PROD_REDIS_PASSWORD: ${ARKRAY_PROD_REDIS_PASSWORD:?set ARKRAY_PROD_REDIS_PASSWORD}
      ARKRAY_PROD_DJANGO_SECRET_KEY: ${ARKRAY_PROD_DJANGO_SECRET_KEY:?set ARKRAY_PROD_DJANGO_SECRET_KEY}
      ARKRAY_PROD_METRICS_TOKEN: ${ARKRAY_PROD_METRICS_TOKEN:?set ARKRAY_PROD_METRICS_TOKEN}
      ARKRAY_PROD_ERASURE_LEDGER_KEY: ${ARKRAY_PROD_ERASURE_LEDGER_KEY:?set ARKRAY_PROD_ERASURE_LEDGER_KEY}
      ARKRAY_PROD_ANTHROPIC_API_KEY: ${ARKRAY_PROD_ANTHROPIC_API_KEY:-}
    command: ["python", "-m", "config.credentials"]

  # Once, as the database superuser: the database, both roles, extensions, R63's logging.
  # Through the server's local socket (the shared `postgres-socket` volume): pg_hba.conf
  # admits the superuser nowhere else, and this container has no network at all (M4).
  db-roles:
    profiles: ["app"]
    image: pgvector/pgvector:0.8.7-pg16-trixie@sha256:40d828eda66737aaacb934387a337babf1455ebd56e9bdd13fc08e211257c972
    logging: *logging
    user: "999:999"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=8m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128m, pids: 32}
    environment:
      PGPASSWORD: ${ARKRAY_PROD_DB_SUPERUSER_PASSWORD:?set ARKRAY_PROD_DB_SUPERUSER_PASSWORD}
      OWNER_PASSWORD: ${ARKRAY_PROD_DB_OWNER_PASSWORD:?set ARKRAY_PROD_DB_OWNER_PASSWORD}
      APP_PASSWORD: ${ARKRAY_PROD_DB_APP_PASSWORD:?set ARKRAY_PROD_DB_APP_PASSWORD}
    volumes:
      - ./infrastructure/postgres:/deploy:ro
      - postgres-socket:/var/run/postgresql
    # The passwords stay in the environment (roles.sql reads them with \getenv), off the
    # command line.
    command: ["psql", "-h", "/var/run/postgresql", "-U", "arkray", "-d", "postgres", "-v", "database=arkray", "-f", "/deploy/roles.sql"]
    depends_on:
      credential-guard:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # On `db-owner` alone (M4): the one network pg_hba.conf admits arkray_owner from. Not on
  # `default` too, where `postgres` could resolve to the server's other address. It needs
  # nothing else: no Redis, no SMTP. `docker compose run --rm migrate python manage.py
  # replay_erasures` (docs/runbooks.md) runs here too, as the owner.
  migrate:
    environment:
      <<: *production-env
      DATABASE_URL: "postgres://arkray_owner:${ARKRAY_PROD_DB_OWNER_PASSWORD:?set ARKRAY_PROD_DB_OWNER_PASSWORD}@postgres:5432/arkray?sslmode=verify-full&sslrootcert=/tls/ca.crt"
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512m, pids: 64}
    tmpfs: !override
      - /tmp:size=16m
    volumes:
      - tls-ca:/tls:ro
    networks:
      - db-owner
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py grant_app_privileges arkray_app"]
    depends_on:
      credential-guard:
        condition: service_completed_successfully
      db-roles:
        condition: service_completed_successfully

  # Volumes merge with docker-compose.yml's by target path: every backend-image service
  # keeps the erasure ledger's volume from there (x-ledger-volume; final audit ARCH-1), and
  # its health check (manage.py ledger_status) for the Celery ones.
  backend:
    environment:
      <<: *production-env
    # gunicorn starts up to 8 workers (WEB_CONCURRENCY): about 100 MB each under load.
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 1536m, pids: 256}
    # An upload is read from the request stream into a spool that moves to /tmp past 1 MB
    # (ATTACHMENT_SPOOL_MEMORY_BYTES), up to ATTACHMENT_MAX_BYTES (10 MB): one per gunicorn
    # worker (8, sync), plus a download's copy fetched from object storage (at most 3 storage
    # calls in flight, 4 per process without Redis): about 120 MB at worst; 256 MB.
    tmpfs: !override
      - /tmp:size=256m
    volumes:
      - tls-ca:/tls:ro
    networks:
      - default  # PostgreSQL, Redis, the ledger's peers
      - api  # nginx, at its fixed address
    ports: !reset []
    depends_on:
      credential-guard:
        condition: service_completed_successfully

  # The scanning worker: the only container on the `scanner` network with ClamAV.
  worker:
    environment:
      <<: *production-env
      DB_STATEMENT_TIMEOUT_MS: "60000"
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1g, pids: 128}
    # A data export is built as a ZIP in /tmp (up to EXPORT_MAX_BYTES, 100 MB) beside a file
    # fetched from storage (10 MB), on each of its 2 Celery processes: 220 MB; 256 MB.
    tmpfs: !override
      - /tmp:size=256m
    networks:
      - default
      - scanner
    volumes:
      - tls-ca:/tls:ro
    depends_on:
      credential-guard:
        condition: service_completed_successfully

  worker-outbox:
    environment:
      <<: *production-env
      DB_STATEMENT_TIMEOUT_MS: "60000"
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 768m, pids: 128}
    tmpfs: !override
      - /tmp:size=32m
    volumes:
      - tls-ca:/tls:ro
    depends_on:
      credential-guard:
        condition: service_completed_successfully

  worker-index:
    environment:
      <<: *production-env
      DB_STATEMENT_TIMEOUT_MS: "60000"
    # The embedding model (ONNX, CPU) is loaded in this process.
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 1536m, pids: 128}
    tmpfs: !override
      - /tmp:size=64m
    volumes:
      - tls-ca:/tls:ro
    depends_on:
      credential-guard:
        condition: service_completed_successfully

  worker-ai:
    environment:
      <<: *production-env
      DB_STATEMENT_TIMEOUT_MS: "60000"
      # Never a developer's key from `.env`: a production-only name, empty while the provider
      # is pinned to none above.
      ANTHROPIC_API_KEY: ${ARKRAY_PROD_ANTHROPIC_API_KEY:-}
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1g, pids: 128}
    tmpfs: !override
      - /tmp:size=32m
    volumes:
      - tls-ca:/tls:ro
    depends_on:
      credential-guard:
        condition: service_completed_successfully

  beat:
    environment:
      <<: *production-env
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 384m, pids: 64}
    # Its schedule file (--schedule /tmp/celerybeat-schedule): a few KB.
    tmpfs: !override
      - /tmp:size=8m
    volumes:
      - tls-ca:/tls:ro
    depends_on:
      credential-guard:
        condition: service_completed_successfully

  frontend:
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 768m, pids: 128}
    # Next.js's cache: no next/image, no ISR or fetch cache (every page is rendered per
    # request for its CSP nonce), so it stays nearly empty; 64 MB bounds it anyway.
    tmpfs: !override
      - /tmp:size=16m
      - /app/.next/cache:uid=10001,gid=10001,size=64m
    # Pages only: the browser fetches every record from /api, which nginx routes to Django
    # itself, so the web tier needs no way to the API (its /api rewrite is development's).
    networks:
      - web
    ports: !reset []
    depends_on:
      credential-guard:
        condition: service_completed_successfully

  # The malware scanner for attachments (R94): clamd and freshclam (signature updates) from
  # the ClamAV project's image. Reachable on port 3310 only over `scanner`, an internal
  # network shared with the scanning worker alone; freshclam reaches the ClamAV mirrors over
  # `clamav-egress`, which nothing else joins. The image ships a recent signature set, which
  # the named volume takes over on first start; freshclam then keeps it current (12 checks
  # a day). Everything runs as the image's clamav user (100:101) from the start, so no
  # capability is needed: the init's ownership fix-ups find everything already clamav's
  # (as root without DAC_OVERRIDE, freshclam couldn't write its own database directory).
  # About 1.2 GB of memory for the signatures, twice that while a new set loads beside the
  # old one.
  clamav:
    profiles: ["app"]
    image: clamav/clamav:1.5@sha256:ebec5bc138401b36ae987caa1a3fa3c3b2a21ed3d51f0bfa5852825e663e67b0
    logging: *logging
    environment:
      FRESHCLAM_CHECKS: "12"
    user: "100:101"
    read_only: true
    tmpfs:
      # clamd's temporary files while it unpacks documents: up to MaxThreads (4) scans at
      # once, each spooling its stream and unpacked members (MaxScanSize, clamd.conf).
      - /tmp:size=512m
      - /run:uid=100,gid=101,size=1m
      - /run/clamav:uid=100,gid=101,mode=775,size=1m
      - /var/lock:uid=100,gid=101,size=1m
      # clamd's log (clamd.conf: a symlink such as /dev/stdout is refused), rotated at 2 MB.
      - /var/log/clamav:uid=100,gid=101,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 3g, pids: 128}
    volumes:
      - ./infrastructure/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - ./infrastructure/clamav/freshclam.conf:/etc/clamav/freshclam.conf:ro
      - ./infrastructure/clamav/healthcheck.sh:/usr/local/bin/arkray-clamav-health:ro
      - clamav-db:/var/lib/clamav
    networks:
      - scanner
      - clamav-egress
    # clamd answers PING and its signatures are under 3 days old (healthcheck.sh: a quietly
    # failing freshclam would otherwise go unnoticed). Loading the signatures takes about a
    # minute; the first start may also download them.
    healthcheck:
      test: ["CMD", "sh", "/usr/local/bin/arkray-clamav-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10m
      start_interval: 10s
    stop_grace_period: 30s
    restart: unless-stopped
    depends_on:
      credential-guard:
        condition: service_completed_successfully

  certs:
    profiles: ["app"]
    image: pgvector/pgvector:0.8.7-pg16-trixie@sha256:40d828eda66737aaacb934387a337babf1455ebd56e9bdd13fc08e211257c972
    logging: *logging
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp:size=8m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128m, pids: 32}
    entrypoint: []
    volumes:
      - certs:/certs
    # The key readable by its owner only (nginx's master reads it as root).
    command: ["sh", "-c", "([ -f /certs/tls.crt ] || openssl req -x509 -newkey rsa:2048 -nodes -days 30 -subj /CN=localhost -addext subjectAltName=DNS:localhost -keyout /certs/tls.key -out /certs/tls.crt) && chmod 600 /certs/tls.key"]
    depends_on:
      credential-guard:
        condition: service_completed_successfully

  nginx:
    profiles: ["app"]
    image: nginx:1.30-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    # Rotated like every container (docker-compose.yml x-logging).
    logging: *logging
    # Read-only like the rest; nginx's master switches to its worker user.
    read_only: true
    # Every tmpfs is capped (deep security audit H-1): a tmpfs is memory, charged to the 256 MB
    # below, and nginx writes request bodies over 16 KB and slowly read responses under
    # /var/cache/nginx before anything is authenticated. Uncapped, 24 slow 10 MB uploads from
    # one address got nginx OOM-killed. 64 MB holds every per-client limit in arkray.conf
    # (4 uploads of 11 MB, one 16 MB response) with room for others; when it is full nginx
    # refuses what needs it (503 JSON) and the rest keeps working. /var/run holds the pid
    # file, /tmp nothing nginx writes.
    # JSON request bodies over 16 KB have an area of their own (/var/cache/nginx-body, 40 MB:
    # an address's 16 body slots x 1 MB stay under half of it, the 8 of one session under a
    # fifth; adversarial review of 73ff1e3, L13), so a flood of them never takes the uploads'
    # area (independent review of H-1, P2-2).
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/cache/nginx-body:size=40m
      - /var/run:size=1m
      - /tmp:size=1m
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 256m, pids: 128}
    volumes:
      - ./infrastructure/nginx/arkray.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/nginx/certs:ro
      # Data-export downloads spooled whole (independent review of H-1, P2-1): disk, not
      # memory, written only after Django answered for a signed-in administrator, at most
      # 4 x 112 MB at a time (arkray.conf). nginx unlinks each spool file as it opens it, so
      # nothing is left here after a crash; the volume holds no data worth keeping.
      - edge-export-spool:/var/cache/nginx-exports
      # Emergency maintenance (arkray.conf, docs/runbooks.md#emergency-maintenance):
      # `touch infrastructure/nginx/maintenance/on` on the host closes the site at the edge
      # (503: the API's envelope, a minimal page; the health check still answers), removing
      # it reopens; no reload. Read-only: nginx only looks for the file.
      - ./infrastructure/nginx/maintenance:/etc/nginx/maintenance:ro
    # Published on `edge` (its alone); the API over `api` from a fixed address (the one
    # TRUSTED_PROXY_ADDRESSES names), the web tier over `web`. Never on `default`: there the
    # API's name would resolve to its other address and the source would be a different one.
    networks:
      edge: {}
      api:
        ipv4_address: 10.252.17.10
      web: {}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    # nginx itself (a loopback-only location on the plain-HTTP server), not what it proxies.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/edge-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      credential-guard:
        condition: service_completed_successfully
      certs:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

networks:
  # nginx and the API only; nginx at a fixed address (TRUSTED_PROXY_ADDRESSES).
  api:
    internal: true
    ipam:
      config:
        - subnet: 10.252.17.0/28
  # PostgreSQL and the migrate job only (M4): the one place pg_hba.conf admits arkray_owner
  # from (its subnet is written there). No route out.
  db-owner:
    internal: true
    ipam:
      config:
        - subnet: 10.252.17.16/28
  # nginx and the web tier only.
  web:
    internal: true
  # nginx's published ports.
  edge: {}
  # ClamAV's port, shared with the scanning worker only; no route out.
  scanner:
    internal: true
  # freshclam's way to the ClamAV mirrors; nothing else is on it.
  clamav-egress: {}

volumes:
  certs:
  tls-ca:
  tls-ca-key:
  tls-postgres:
  tls-redis:
  tls-mailpit:
  clamav-db:
  edge-export-spool:
  postgres-socket:
