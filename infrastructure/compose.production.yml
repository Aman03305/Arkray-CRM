# Arkray CRM: a production-shaped stack on one machine. Phase 11 verifies the release with
# it; it is also the reference for real manifests (docs/deployment.md). Unlike the
# development stack it runs exactly as production must: HTTPS at an nginx edge (a
# self-signed certificate here), secure __Host- cookies and HSTS, the two database roles
# (migrations as the owner, everything else as an application role the web server and
# workers check at start), Redis with a password, no insecure opt-in, read-only containers,
# and only the proxy published.
#
#   export DJANGO_SECRET_KEY=... POSTGRES_PASSWORD=... ARKRAY_OWNER_PASSWORD=... \
#          ARKRAY_APP_PASSWORD=... REDIS_PASSWORD=... METRICS_TOKEN=...
#   docker compose -p arkray-prod -f docker-compose.yml -f infrastructure/compose.production.yml \
#       --profile app up -d --build
#   open https://localhost:8443   (Mailpit's inbox: http://localhost:58125)
#
# A separate project (-p) with its own volumes: it never touches the development stack.

x-production-env: &production-env
  DJANGO_ALLOW_INSECURE_LOCAL_HTTP: "false"
  DJANGO_SECURE_COOKIES: "true"
  DJANGO_SECURE_SSL_REDIRECT: "true"
  DJANGO_HSTS_SECONDS: "31536000"
  DJANGO_ALLOWED_HOSTS: localhost,backend
  DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost:8443
  APP_BASE_URL: https://localhost:8443
  # One proxy (nginx) appends the client address. On this single Compose network every
  # container could reach the backend directly, so "*" is acceptable only here: in
  # production a network policy lets only the proxy reach Django, and FORWARDED_ALLOW_IPS
  # names the proxy's addresses (docs/deployment.md#reverse-proxy).
  TRUSTED_PROXY_COUNT: "1"
  FORWARDED_ALLOW_IPS: "*"
  TRUST_INCOMING_REQUEST_ID: "true"
  DATABASE_URL: postgres://arkray_app:${ARKRAY_APP_PASSWORD:?set ARKRAY_APP_PASSWORD}@postgres:5432/arkray
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  REDIS_CACHE_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/1
  DB_REQUIRE_RESTRICTED_ROLE: "true"
  # Pinned, not interpolated: Compose reads the repository's .env for this project too, and
  # a developer's AI_ENABLED=false there turned Ask Arkray off on a backend recreated alone
  # (the workers kept it on; 271 notes went unindexed, silently: whole-software audit).
  # tests/architecture/test_compose_production.py keeps every interpolated setting pinned.
  AI_ENABLED: "true"
  AI_LLM_PROVIDER: none
  LOG_LEVEL: INFO
  # Required: the metrics endpoint (and the alerts on it) exists only with a token.
  METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN (at least 32 characters)}
  # This rehearsal keeps attachments on a private volume (pinned, like every setting here);
  # a real deployment normally points ATTACHMENT_STORAGE=s3 at a private bucket.
  ATTACHMENT_STORAGE: filesystem
  ATTACHMENT_ROOT: /var/lib/arkray/attachments

services:
  postgres:
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: arkray  # the administrator, pinned like every setting (not from .env)
      # No default superuser password here (Phase 11 review): any container on the network
      # that knew it could connect as the superuser and rewrite the audit trail.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (the superuser's)}
    command: ["postgres", "-c", "log_min_error_statement=panic", "-c", "log_error_verbosity=terse", "-c", "shared_preload_libraries=pg_stat_statements"]
    ports: !reset []

  redis:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      # The password through the environment, not a command line (`ps`).
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
    ports: !reset []

  mailpit:
    ports: !override
      - "127.0.0.1:58125:8025"

  # Once, as the database superuser: the database, both roles, extensions, R63's logging.
  db-roles:
    profiles: ["app"]
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      OWNER_PASSWORD: ${ARKRAY_OWNER_PASSWORD:?set ARKRAY_OWNER_PASSWORD}
      APP_PASSWORD: ${ARKRAY_APP_PASSWORD:?set ARKRAY_APP_PASSWORD}
    volumes:
      - ./infrastructure/postgres:/deploy:ro
    # The passwords stay in the environment (roles.sql reads them with \getenv), off the
    # command line.
    command: ["psql", "-h", "postgres", "-U", "arkray", "-d", "postgres", "-v", "database=arkray", "-f", "/deploy/roles.sql"]
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    environment:
      <<: *production-env
      DATABASE_URL: postgres://arkray_owner:${ARKRAY_OWNER_PASSWORD:?set ARKRAY_OWNER_PASSWORD}@postgres:5432/arkray
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py grant_app_privileges arkray_app"]
    depends_on:
      db-roles:
        condition: service_completed_successfully

  backend:
    environment:
      <<: *production-env
    ports: !reset []

  worker:
    environment:
      <<: *production-env
      DB_STATEMENT_TIMEOUT_MS: "60000"

  worker-index:
    environment:
      <<: *production-env
      DB_STATEMENT_TIMEOUT_MS: "60000"

  worker-ai:
    environment:
      <<: *production-env
      DB_STATEMENT_TIMEOUT_MS: "60000"

  beat:
    environment:
      <<: *production-env

  frontend:
    ports: !reset []

  certs:
    profiles: ["app"]
    image: alpine:3.20
    volumes:
      - certs:/certs
    # The key readable by its owner only (nginx's master reads it as root).
    command: ["sh", "-c", "([ -f /certs/tls.crt ] || (apk add --no-cache openssl >/dev/null && openssl req -x509 -newkey rsa:2048 -nodes -days 30 -subj /CN=localhost -addext subjectAltName=DNS:localhost -keyout /certs/tls.key -out /certs/tls.crt)) && chmod 600 /certs/tls.key"]

  nginx:
    profiles: ["app"]
    image: nginx:1.27-alpine
    # Read-only like the rest; nginx's master switches to its worker user.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./infrastructure/nginx/arkray.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/nginx/certs:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    depends_on:
      certs:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  certs:
