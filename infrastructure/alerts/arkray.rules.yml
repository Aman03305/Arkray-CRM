# Prometheus alerting rules for Arkray CRM's /health/metrics (docs/observability.md#alerts).
# The metric-based alerts of that table, as rules a Prometheus (or a compatible system:
# Grafana, VictoriaMetrics, Amazon Managed Prometheus) can load. Before the whole-software
# audit they existed only as prose. The log-based alerts (5xx rate, latency, sign-in
# failures, security events) come from the access log and belong in the log platform.
#
# Scrape every 30 s with `Authorization: Bearer $METRICS_TOKEN`, each pod directly (the
# edge proxy doesn't route /health), under the job name `arkray` (ArkrayMetricsUnavailable
# names it). Every alert links its runbook.
# tests/architecture/test_alert_rules.py checks that each metric named here exists.
groups:
  - name: arkray
    rules:
      - alert: ArkrayDatabaseUnreachable
        expr: arkray_db_up == 0
        for: 1m
        labels: {severity: page}
        annotations:
          summary: "The API can't reach PostgreSQL: requests answer 503."
          runbook: docs/runbooks.md#database-down

      # A database that stalls (paused, failing over) instead of refusing leaves the scrape
      # itself hanging until the web server kills the worker: Prometheus then sees a failed
      # target, never `arkray_db_up 0` (final audit SRE-3). The same rule catches a crashed or
      # unreachable pod.
      - alert: ArkrayMetricsUnavailable
        expr: up{job="arkray"} == 0 or absent(arkray_db_up)
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "An API pod's metrics scrape fails or times out: a stalled database, a hung web tier or a pod that is down."
          runbook: docs/runbooks.md#database-stalled

      # The erasure-ledger gate closes the API (every request and readiness 503) while the
      # database is behind the ledger (a restore not yet replayed), ahead of it or diverged
      # (the ledger was rolled back or replaced), tampered, or unreadable for over an hour
      # (R116). Before deployment preparation the probes saw only "not ready". The status
      # label names the case; the runbook says which command fixes which.
      - alert: ArkrayErasureLedgerGateClosed
        expr: min by (status) (arkray_erasure_ledger_gate_open) == 0
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "The erasure-ledger gate is closed ({{ $labels.status }}): the API answers 503 until the ledger and the database agree."
          runbook: docs/runbooks.md#erasure-ledger-behind

      - alert: ArkrayDatabaseSaturated
        expr: arkray_db_server_connections / arkray_db_max_connections > 0.8
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: "PostgreSQL connections above 80 % of max_connections."
          runbook: docs/runbooks.md#connection-budget

      - alert: ArkrayBackgroundWorkStalled
        expr: arkray_outbox_oldest_due_seconds > 600
        labels: {severity: page}
        annotations:
          summary: "Queue {{ $labels.queue }}: due work waiting over 10 minutes (the relay or beat is down)."
          runbook: docs/runbooks.md#outbox-backlog

      - alert: ArkrayWorkNotTaken
        expr: arkray_outbox_oldest_undelivered_seconds > 300
        labels: {severity: page}
        annotations:
          summary: "Queue {{ $labels.queue }}: work handed to the broker 5 minutes ago and no worker has started it (its workers are down)."
          runbook: docs/runbooks.md#workers

      - alert: ArkrayDeadEvents
        expr: delta(arkray_outbox_events{status="dead"}[15m]) > 0
        labels: {severity: ticket}
        annotations:
          summary: "Queue {{ $labels.queue }}: background work gave up (dead events)."
          runbook: docs/runbooks.md#dead-events

      - alert: ArkrayBrokerQueueGrowing
        expr: deriv(arkray_broker_queue_length[15m]) > 0 and arkray_broker_queue_length > 100
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: "Queue {{ $labels.queue }}: the broker backlog keeps growing."
          runbook: docs/runbooks.md#workers

      - alert: ArkrayBrokerDown
        expr: arkray_broker_up == 0
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "Redis (broker) unreachable: background work queues in PostgreSQL until it is back."
          runbook: docs/runbooks.md#redis-down

      - alert: ArkrayCacheDown
        expr: arkray_cache_up == 0
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "Redis (cache) unreachable: the CRM works, rate limits fall back."
          runbook: docs/runbooks.md#redis-down

      - alert: ArkrayAskModelUnavailable
        expr: arkray_ai_breaker_open == 1
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: "Ask Arkray's model provider failing: answers fall back to retrieval."
          runbook: docs/runbooks.md#ask-arkray-degraded

      # A database-wide count that every API pod reports alike: one pod's figure (max over
      # pods), or the 10-question floor would shrink with the number of pods (production
      # readiness review).
      - alert: ArkrayAskFailing
        expr: >
          max(sum by (instance) (arkray_ai_questions_last_hour{error=~"ai_unavailable|timeout"}))
          / clamp_min(max(sum by (instance) (arkray_ai_questions_last_hour)), 1) > 0.2
          and max(sum by (instance) (arkray_ai_questions_last_hour)) >= 10
        labels: {severity: ticket}
        annotations:
          summary: "Over 20 % of Ask Arkray questions failed or timed out in the last hour."
          runbook: docs/runbooks.md#ask-arkray-degraded

      - alert: ArkrayIndexingBacklog
        expr: arkray_outbox_events{queue="ai_index",status="pending"} > 1000
        for: 30m
        labels: {severity: ticket}
        annotations:
          summary: "Ask Arkray's index is falling behind (over 1,000 sources waiting)."
          runbook: docs/runbooks.md#re-indexing

      # --- attachment storage (final audit SRE-4; docs/observability.md#attachment-storage) ---
      # The *_last_hour counters live in the shared cache: every pod reports the same
      # cluster-wide figure, hence max() rather than sum() across pods.
      - alert: ArkrayAttachmentStorageDown
        expr: max by (backend) (arkray_attachment_storage_up) == 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "Attachment storage ({{ $labels.backend }}) fails its liveness check: uploads and downloads answer 503; the rest of the CRM works."
          runbook: docs/runbooks.md#attachment-storage-degraded

      - alert: ArkrayAttachmentObjectMissing
        expr: max(arkray_attachment_objects_missing_last_hour) > 0
        labels: {severity: ticket}
        annotations:
          summary: "A stored file's object is gone from storage (downloads answer 410): lost data to investigate."
          runbook: docs/runbooks.md#attachment-object-missing

      - alert: ArkrayAttachmentUploadsFailing
        expr: >
          max(sum by (instance) (arkray_attachment_uploads_last_hour{outcome="failed",reason=~"storage_error|timeout"}))
          / clamp_min(max(sum by (instance) (arkray_attachment_uploads_last_hour)), 1) > 0.2
          and max(sum by (instance) (arkray_attachment_uploads_last_hour)) >= 5
        labels: {severity: ticket}
        annotations:
          summary: "Over 20 % of file uploads failed on storage (errors or timeouts) in the last hour."
          runbook: docs/runbooks.md#attachment-storage-degraded

      - alert: ArkrayAttachmentUploadStuck
        expr: max(arkray_attachment_oldest_seconds{state="uploading"}) > 3600
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: "An upload has been unfinished for over an hour: the hourly housekeeping isn't resolving it."
          runbook: docs/runbooks.md#attachment-reconciliation

      # Fail-closed scanning (R94): a file waiting for its malware scan doesn't download. An
      # hour means the scanner is down or misconfigured (clamd limits below the upload limit),
      # or the scan jobs died; without this, users only see "Being checked" (final hardening).
      - alert: ArkrayAttachmentScanOverdue
        expr: max(arkray_attachment_oldest_seconds{state="pending_scan"}) > 3600
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: "Files have waited over an hour for a malware scan: they don't download (scanner down or misconfigured)."
          runbook: docs/runbooks.md#attachment-reconciliation

      - alert: ArkrayAttachmentReconcileMismatch
        expr: max by (kind) (arkray_attachment_reconcile_mismatches) > 0
        labels: {severity: ticket}
        annotations:
          summary: "The last attachment reconciliation found {{ $labels.kind }} files."
          runbook: docs/runbooks.md#attachment-reconciliation

      - alert: ArkrayAttachmentReconcileFailed
        expr: max(arkray_attachment_reconcile_outcome) == 2
        labels: {severity: ticket}
        annotations:
          summary: "The last attachment reconciliation couldn't finish (storage errors or its time budget)."
          runbook: docs/runbooks.md#attachment-reconciliation

      - alert: ArkrayAttachmentReconcileNotRun
        expr: min(arkray_attachment_reconcile_age_seconds) > 172800
        labels: {severity: ticket}
        annotations:
          summary: "No whole attachment reconciliation in 48 hours (the daily check is off or failing to start, or beat is down)."
          runbook: docs/runbooks.md#attachment-reconciliation

      # No result at all (never ran since the cache was emptied, or ATTACHMENT_RECONCILE_DAILY
      # is off) while the cache answers; 48 h, so a fresh deployment's first night isn't one.
      - alert: ArkrayAttachmentReconcileNeverRun
        expr: absent(arkray_attachment_reconcile_age_seconds) and on() max(arkray_cache_up) == 1
        for: 48h
        labels: {severity: ticket}
        annotations:
          summary: "No attachment reconciliation result for 48 hours."
          runbook: docs/runbooks.md#attachment-reconciliation

      # --- accounts (ADR-0033, R126) -----------------------------------------------------------
      # One administrator can deactivate the others (only the last active one is protected):
      # every deactivation of an administrator is worth a human look. A database-wide count
      # every pod reports alike (max over pods); it stays above 0 for an hour after each one.
      - alert: ArkrayAdministratorDeactivated
        expr: max(arkray_administrator_deactivations_last_hour) > 0
        labels: {severity: ticket}
        annotations:
          summary: "An administrator account was deactivated in the last hour: confirm it was intended."
          runbook: docs/runbooks.md#administrator-deactivated

      # Too many wrong second-factor codes in a row locked an account (deep security audit
      # M-4). Codes are asked for only after the right password, so someone else very
      # probably has it. The owner is emailed too; it stays raised for an hour after each one.
      - alert: ArkrayMfaLocked
        expr: max(arkray_mfa_lockouts_last_hour) > 0
        labels: {severity: ticket}
        annotations:
          summary: "A user's two-step verification was locked by too many wrong codes in the last hour: their password is probably known to someone else."
          runbook: docs/runbooks.md#second-factor-locked

      # Past the cap a new password doesn't clear (R133): the wrong codes went on across new
      # passwords chosen through the emailed link, so whoever typed them very probably reads
      # the owner's mailbox too. Only an MFA reset unlocks it; it stays raised for an hour.
      - alert: ArkrayMfaLockedUntilReset
        expr: max(arkray_mfa_locked_until_reset_last_hour) > 0
        labels: {severity: ticket}
        annotations:
          summary: "A user's two-step verification was locked until an MFA reset in the last hour: their password and probably their mailbox are known to someone else."
          runbook: docs/runbooks.md#second-factor-locked

      # --- account takeover (review of 73ff1e3, L1 and L3) ------------------------------------
      # Promoting an account an administrator took over put it out of every other
      # administrator's reach (R100, promote-then-shield): every promotion is worth a look.
      # A database-wide count (max over pods); it stays raised for an hour after each one.
      - alert: ArkrayAdministratorPromoted
        expr: max(arkray_administrator_promotions_last_hour) > 0
        labels: {severity: ticket}
        annotations:
          summary: "An account was made an administrator in the last hour: confirm it was intended (security events: user.role_changed)."
          runbook: docs/runbooks.md#security-events

      # Failed sign-ins of real accounts far above people mistyping (every account and address
      # together; auth.login_failed audit events): guessing or password spraying is going on.
      # Per account and per address the throttle bounds it; this is for a human to look.
      - alert: ArkraySignInFailureStorm
        expr: max(arkray_sign_in_failures_last_hour) > 200
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "More than 200 failed sign-ins in the last hour, for 10 minutes: password guessing or spraying is going on."
          runbook: docs/runbooks.md#security-events

      # An account reached the daily cap of failed sign-ins from new browsers and is locked
      # from them until its owner's emailed link, a reset or an administrator lifts it
      # (auth.sign_in_locked). It stays raised for an hour after each one.
      - alert: ArkraySignInLocked
        expr: max(arkray_sign_in_locks_last_hour) > 0
        labels: {severity: ticket}
        annotations:
          summary: "An account's sign-in from new browsers was locked by too many failed sign-ins in the last hour: someone is guessing its password."
          runbook: docs/runbooks.md#security-events

      # One user's work is most of a large backlog (review of 73ff1e3, M6): a runaway script or
      # an abusive account. The relay takes turns between users, so others are still served
      # first; this is for a human to find whose it is (`manage.py outbox_requeue --status`)
      # and whether its write budget needs lowering. Never a user in the metric itself.
      - alert: ArkrayQueueDominatedByOneUser
        expr: arkray_outbox_top_key_share > 0.8 and on (queue) arkray_outbox_events{status="pending"} > 500
        for: 30m
        labels: {severity: ticket}
        annotations:
          summary: "Queue {{ $labels.queue }}: one user's work has been over 80 % of a backlog of more than 500 events for 30 minutes."
          runbook: docs/runbooks.md#outbox-backlog
