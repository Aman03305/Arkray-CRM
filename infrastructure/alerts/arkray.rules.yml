# Prometheus alerting rules for Arkray CRM's /health/metrics (docs/observability.md#alerts).
# The metric-based alerts of that table, as rules a Prometheus (or a compatible system:
# Grafana, VictoriaMetrics, Amazon Managed Prometheus) can load. Before the whole-software
# audit they existed only as prose. The log-based alerts (5xx rate, latency, sign-in
# failures, security events) come from the access log and belong in the log platform.
#
# Scrape every 30 s with `Authorization: Bearer $METRICS_TOKEN`, each pod directly (the
# edge proxy doesn't route /health). Every alert links its runbook.
# tests/architecture/test_alert_rules.py checks that each metric named here exists.
groups:
  - name: arkray
    rules:
      - alert: ArkrayDatabaseUnreachable
        expr: arkray_db_up == 0
        for: 1m
        labels: {severity: page}
        annotations:
          summary: "The API can't reach PostgreSQL: requests answer 503."
          runbook: docs/runbooks.md#database-down

      - alert: ArkrayDatabaseSaturated
        expr: arkray_db_server_connections / arkray_db_max_connections > 0.8
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: "PostgreSQL connections above 80 % of max_connections."
          runbook: docs/runbooks.md#connection-budget

      - alert: ArkrayBackgroundWorkStalled
        expr: arkray_outbox_oldest_due_seconds > 600
        labels: {severity: page}
        annotations:
          summary: "Queue {{ $labels.queue }}: due work waiting over 10 minutes (the relay or beat is down)."
          runbook: docs/runbooks.md#outbox-backlog

      - alert: ArkrayWorkNotTaken
        expr: arkray_outbox_oldest_undelivered_seconds > 300
        labels: {severity: page}
        annotations:
          summary: "Queue {{ $labels.queue }}: work handed to the broker 5 minutes ago and no worker has started it (its workers are down)."
          runbook: docs/runbooks.md#workers

      - alert: ArkrayDeadEvents
        expr: delta(arkray_outbox_events{status="dead"}[15m]) > 0
        labels: {severity: ticket}
        annotations:
          summary: "Queue {{ $labels.queue }}: background work gave up (dead events)."
          runbook: docs/runbooks.md#dead-events

      - alert: ArkrayBrokerQueueGrowing
        expr: deriv(arkray_broker_queue_length[15m]) > 0 and arkray_broker_queue_length > 100
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: "Queue {{ $labels.queue }}: the broker backlog keeps growing."
          runbook: docs/runbooks.md#workers

      - alert: ArkrayBrokerDown
        expr: arkray_broker_up == 0
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "Redis (broker) unreachable: background work queues in PostgreSQL until it is back."
          runbook: docs/runbooks.md#redis-down

      - alert: ArkrayCacheDown
        expr: arkray_cache_up == 0
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "Redis (cache) unreachable: the CRM works, rate limits fall back."
          runbook: docs/runbooks.md#redis-down

      - alert: ArkrayAskModelUnavailable
        expr: arkray_ai_breaker_open == 1
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: "Ask Arkray's model provider failing: answers fall back to retrieval."
          runbook: docs/runbooks.md#ask-arkray-degraded

      - alert: ArkrayAskFailing
        expr: >
          sum(arkray_ai_questions_last_hour{error=~"ai_unavailable|timeout"})
          / clamp_min(sum(arkray_ai_questions_last_hour), 1) > 0.2
          and sum(arkray_ai_questions_last_hour) >= 10
        labels: {severity: ticket}
        annotations:
          summary: "Over 20 % of Ask Arkray questions failed or timed out in the last hour."
          runbook: docs/runbooks.md#ask-arkray-degraded

      - alert: ArkrayIndexingBacklog
        expr: arkray_outbox_events{queue="ai_index",status="pending"} > 1000
        for: 30m
        labels: {severity: ticket}
        annotations:
          summary: "Ask Arkray's index is falling behind (over 1,000 sources waiting)."
          runbook: docs/runbooks.md#re-indexing
