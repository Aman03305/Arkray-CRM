# Arkray CRM: reference edge proxy (docs/deployment.md#reverse-proxy).
#
# One origin for pages and API: /api goes straight to Django (gunicorn), everything else to
# Next.js. TLS terminates here. The rules the application depends on:
#   - X-Forwarded-For and X-Forwarded-Proto are OVERWRITTEN, never passed through (client IPs
#     drive rate limits and the audit trail; set TRUSTED_PROXY_COUNT=1 behind this proxy);
#   - X-Request-ID is minted here (set TRUST_INCOMING_REQUEST_ID=true);
#   - the access log has no query strings (search terms travel in them, R61), no one-time
#     secrets (invitation and password-reset links, matched case-insensitively), no Referer
#     and no User-Agent (privacy remediation: a browser fingerprint the operations need
#     no more than the address); the error log keeps critical events only, because nginx
#     writes the whole request line (query string and token included) into every error it
#     logs (Phase 11 review);
#   - its memory is bounded before anyone signs in: a capped temp area, per-client limits on
#     requests in flight and uploads, short body and header timeouts (H-1, below);
#   - /health/* is not routed: probes and the metrics scraper reach the pods directly;
#   - requests for any other host name end at the TLS handshake;
#   - an operator's switch (a file, no reload) closes the site here for an emergency
#     maintenance: every HTTPS request answered 503 by nginx itself (below);
#   - API requests have a rate per signed-in session, per address without one, and a
#     per-address ceiling; a request body takes a slot only when it can reach the temp area,
#     per session (adversarial review of 73ff1e3, L2 and L13, below);
#   - no answer names nginx's version, TLS is forward-secret AEAD only without session
#     tickets, plain HTTP redirects to one fixed name, and the request headers only proxies or
#     Next.js itself set never pass from a client (the same review's hardening).
# The ports (8080/8443), the name and the certificate paths are the local verification
# stack's (infrastructure/compose.production.yml); in production use 80/443, the public name
# (server_name and the plain-HTTP redirect) and real certificates.

error_log /var/log/nginx/error.log crit;

# No version on any answer: the default server's and every error page nginx writes before a
# server is chosen included (it was set per server only; adversarial review of 73ff1e3).
server_tokens off;

# TLS for every server, the default one that refuses unknown names included: TLS 1.2 with
# forward-secret AEAD suites only (Mozilla's intermediate list without the DHE suites, which
# need parameters of their own), TLS 1.3's own suites, and no session tickets: their key
# lives as long as the process and would let a stolen copy decrypt every recorded session
# that resumed with it. The session cache stays (per server, below).
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_tickets off;

map $uri $arkray_log_path {
    ~*^/activate/        /activate/[redacted];
    ~*^/reset-password/  /reset-password/[redacted];
    ~*^/unlock-sign-in/  /unlock-sign-in/[redacted];
    default              $uri;
}

# The upstream's address, status and time: with the error log at `crit`, they are how a
# 502/504 is attributed to the API or the web tier (whole-software audit).
log_format arkray '$remote_addr [$time_iso8601] "$request_method $arkray_log_path '
                  '$server_protocol" $status $body_bytes_sent $request_time '
                  '$request_id '
                  'upstream=$upstream_addr upstream_status=$upstream_status '
                  'upstream_time=$upstream_response_time';

# Upstream names are re-resolved while nginx runs (`resolve`, nginx 1.27.3+): replaced
# containers get new addresses, and an address resolved once at startup turned every API
# request into a 502 after the backend was redeployed (Phase 11). 127.0.0.11 is Docker's
# DNS; use the platform's resolver elsewhere (a Kubernetes Service's address is stable).
resolver 127.0.0.11 valid=10s ipv6=off;

# Behind a CDN or a load balancer (Cloudflare, an ALB), $remote_addr is the proxy's address,
# so every client would share one key below and every per-client limit in this file would be
# the whole site's (adversarial review of 73ff1e3, L13: one slow client then blocks
# everyone's writes). Take the client's address from the proxy's header, trusting it from the
# proxy's own published ranges only, never 0.0.0.0/0 (anyone could then name any address),
# and let nothing but those ranges reach this origin (a security group, Cloudflare's
# Authenticated Origin Pulls): docs/operations.md#edge-rate-limits.
#   set_real_ip_from 173.245.48.0/20;   # ... and every other range Cloudflare publishes
#   real_ip_header CF-Connecting-IP;    # an ALB: X-Forwarded-For, with real_ip_recursive on

# Who a client is, for the limit below (R127): an IPv4 address as is, an IPv6 client by its
# /64 (one subscriber line or host usually holds a whole /64, so keying by the full address
# gave one machine 2**64 fresh budgets), the same rule as the API's own limits
# (arkray.core.throttling.address_key). $remote_addr is nginx's canonical text (lower case,
# no leading zeros, the longest run of two or more zero groups as "::", IPv4-mapped as
# ::ffff:a.b.c.d), so the first four groups are found by where "::" is: the key is always
# four explicit groups, whatever the address's own compression. Regexes are tried in order;
# tests/architecture/test_edge_rate_limits.py checks them against nginx's formatting of
# thousands of addresses, and anything they don't recognise keeps its full address.
map $remote_addr $arkray_client_key {
    default                                                       $remote_addr;
    "~^\d{1,3}(?:\.\d{1,3}){3}$"  $remote_addr;
    "~*^::ffff:(\d{1,3}(?:\.\d{1,3}){3})$"  $1;
    "~*^([0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}):"  $1;
    "~*^::([0-9a-f]{1,4}:[0-9a-f]{1,4})(?::[0-9a-f]{1,4}){4}$"  0:0:$1;
    "~*^::([0-9a-f]{1,4})(?::[0-9a-f]{1,4}){4}$"  0:0:0:$1;
    "~*^([0-9a-f]{1,4})::([0-9a-f]{1,4})(?::[0-9a-f]{1,4}){4}$"  $1:0:0:$2;
    "~*^([0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4})::"  $1:0;
    "~*^([0-9a-f]{1,4}:[0-9a-f]{1,4})::"  $1:0:0;
    "~*^([0-9a-f]{1,4})::"  $1:0:0:0;
    "~^::"  0:0:0:0;
}

# The public authentication routes, refused here before they take a web worker. Django's own
# limits (20 sign-ins a minute per address, the durable failure budgets) stay the authority;
# this only stops a flood from one address occupying gunicorn's sync workers: in the capacity
# test, 8 connections hammering /auth/login without pauses raised every other user's p99 from
# 0.24 s to 3.2 s (docs/capacity.md#abuse). Generous for an office behind one address: 5 a
# second sustained, bursts of 30. Per address only on these routes (everyone else in an
# office shares the address, so no global per-address limit).
limit_req_zone $arkray_client_key zone=arkray_auth:10m rate=5r/s;
limit_req_status 429;
limit_req_log_level warn;

# The session a request belongs to (adversarial review of 73ff1e3, L2 and L13): the session
# cookie's value, `__Host-arkray_session` over HTTPS (`arkray_session` on the plain-HTTP
# local stack), and only in Django's own format (32 of [a-z0-9]): anything else is no session,
# so a limit key is never longer than that. Only a key in nginx's memory, never logged. A
# client may send any value it likes: every key built from it also counts against a
# per-address ceiling.
map $http_cookie $arkray_session {
    default  "";
    "~(?:^|;)\s*(?:__Host-)?arkray_session=([a-z0-9]{32})(?:;|\s|$)"  $1;
}

# Requests to the API (L2): DRF checks permissions before its throttles, so 401 and 403
# answers were never limited, and one client could keep the sync web workers busy with cheap
# refused requests. Every API location now has a rate per signed-in session, per address for
# requests without a session (sign-ins, password resets, a page load before sign-in), and a
# per-address ceiling over both. Generous on purpose: Django's limits (R77) stay the
# authority for everything they count; these stop floods. An office of 100 behind one
# address made 89 requests a second, 147 at twice the pace (docs/capacity.md): the ceiling is
# twice that, with a burst of 1,000. Refused with 429 in the API's JSON shape, like the rest.
map $arkray_session $arkray_api_session_key {
    ""       "";
    default  $arkray_session;
}
map $arkray_session $arkray_api_anonymous_key {
    ""       $arkray_client_key;
    default  "";
}
limit_req_zone $arkray_api_session_key zone=arkray_api_session:10m rate=20r/s;
limit_req_zone $arkray_api_anonymous_key zone=arkray_api_anonymous:10m rate=10r/s;
limit_req_zone $arkray_client_key zone=arkray_api_address:10m rate=300r/s;

# Memory (deep security audit H-1). nginx writes every request body over 16 KB
# (client_body_buffer_size) and every response its client reads too slowly to a temp file
# under /var/cache/nginx, before anything is authenticated. In the container that directory
# is a tmpfs, and a tmpfs is memory: uncapped, 24 connections from one address each sending
# 10 MB of an attachment and then one byte every few seconds got nginx OOM-killed (256 MB
# limit) and cut everyone off. Three bounds now, checked live with that attack and in
# tests/architecture/test_edge_limits.py:
#   - the tmpfs has a size (compose.production.yml: 64 MB): when it is full nginx refuses
#     the request needing it (503 in the API's JSON shape below) instead of growing;
#   - one client (the same key as the sign-in limit) has at most 256 requests in flight
#     here; bodies that can reach a temp area at most 8 per session (or per address without
#     one) and 16 per address (L13, below); uploads at most 4 (4 x 11 MB fit the temp area
#     with room for everyone else).
#     Generous for an office behind one address: the capacity test's 100 users, all from one
#     address, made 89 requests a second at a 38 ms median (docs/capacity.md), and the API
#     stores 3 files at a time anyway (ATTACHMENT_STORAGE_MAX_IN_FLIGHT_SHARED). Refused
#     with 429 in the API's JSON shape (a page: a minimal HTML page), like limit_req;
#   - a client that stops sending its headers for 15 s or its body for 10 s, or stops
#     reading for 30 s, is dropped (nginx's defaults are 60 s each).
# Connections idle between requests and slow TLS handshakes are not counted (nginx counts a
# request once its headers are read); worker_connections (the image's 1024 per worker)
# bounds those.
limit_conn_zone $arkray_client_key zone=arkray_conn:10m;
limit_conn_zone $arkray_client_key zone=arkray_upload:10m;
# Requests that carry a body (independent review of H-1, P2-2): 256 slow 1 MB JSON bodies
# from one address filled the temp area without signing in. An HTTP/2 request can send a
# body without declaring it, so JSON bodies also have a temp area of their own (the server
# block): what fills it can only stop JSON writes over 16 KB, never uploads.
# Which bodies take a slot (adversarial review of 73ff1e3, L13): eight bodies trickled a byte
# every 14 s held every slot of their address, so one person on an office's shared address
# blocked everyone's saves and sign-ins. Only a body that can reach the temp area takes one
# now: declared over the in-memory buffer (client_body_buffer_size, 16 KB, in the server
# block) or not declared at all (chunked, HTTP/2). A sign-in or an ordinary save stays in
# memory and takes none (the per-client limit on requests in flight still bounds them).
map "$request_method:$http_content_length$http_transfer_encoding" $arkray_spooled_body {
    "~^(GET|HEAD|OPTIONS):$"  "";
    "~^[A-Z]+:([0-9]{1,4}|1[0-5][0-9]{3}|16[0-2][0-9]{2}|163[0-7][0-9]|1638[0-4])$"  "";
    default                   1;
}
# And whose slots they are: the session's (its cookie, above), so a co-worker's large save
# never waits for another session's bodies; without a session, the address's. 8 each, and a
# per-address ceiling of 16 over them all (the server block): forged session cookies take no
# more than that from one address.
map "$arkray_spooled_body:$arkray_session" $arkray_body_client_key {
    "~^:"    "";
    "1:"     $arkray_client_key;
    default  $arkray_session;
}
map $arkray_spooled_body $arkray_body_address_key {
    ""       "";
    default  $arkray_client_key;
}
limit_conn_zone $arkray_body_client_key zone=arkray_body:10m;
limit_conn_zone $arkray_body_address_key zone=arkray_body_address:10m;
# The small bodies (review round 1, INFRA-3): taking no JSON-body slot, they counted only
# against the 256 requests in flight, and 256 of them trickled from one client blocked its
# address's every request, reads and page loads included. A ceiling of their own, half of
# those: whatever they hold, the address keeps room for its reads. (A trickler on the same
# address still holds its small writes: only a total request deadline ends that; nginx has
# none for bodies, so a shared office needs a front proxy with one: docs/operations.md.)
map "$request_method:$http_content_length" $arkray_small_body_key {
    "~^[A-Z]+:([1-9][0-9]{0,3}|1[0-5][0-9]{3}|16[0-2][0-9]{2}|163[0-7][0-9]|1638[0-4])$"  $arkray_client_key;
    default  "";
}
limit_conn_zone $arkray_small_body_key zone=arkray_small_body:10m;
# Pages (Next.js) take GET and HEAD without a body, nothing else: no server actions, no route
# handlers. Anything else is answered 405 before a slot is taken (the page location).
map "$request_method:$http_content_length$http_transfer_encoding" $arkray_page_refused {
    "~^(GET|HEAD):0?$"  0;
    default             1;
}
# Data-export downloads (P2-1, the export location below): per client, and all clients
# together ($server_name: one key for the whole server), so their disk spool is bounded.
limit_conn_zone $arkray_client_key zone=arkray_export:1m;
limit_conn_zone $server_name zone=arkray_export_all:1m;
limit_conn_status 429;
limit_conn_log_level warn;
# The whole header within 10 s: nginx sets this timer once per request (unlike the body's,
# between two reads), so a client trickling its headers is dropped then (review round 1).
# Connections still sending headers aren't counted by limit_conn: worker_connections and
# the platform's connection limits bound them (docs/operations.md#edge-rate-limits).
client_header_timeout 10s;
# 10 s without a byte of the body ends it (15 s before; L13): a stalled body holds its slot
# for less, and an honest one on a slow line still sends far more often.
client_body_timeout 10s;
send_timeout 30s;

# Emergency maintenance (docs/runbooks.md#emergency-maintenance). The switch is a file: an
# operator creates `on` in the directory mounted read-only at /etc/nginx/maintenance
# (compose.production.yml: infrastructure/nginx/maintenance/ on the host) and from the next
# request nginx answers every request on the HTTPS server itself, before any location, limit
# or upstream: 503 with Retry-After and no-store, in the API's JSON envelope with the request
# id on /api/ (`service_unavailable`, which the web app already shows as "temporarily
# unavailable" and doesn't retry), a minimal page with the request id elsewhere. Nothing
# reaches Django or Next.js, so a restore, a stopped-deploy migration or an incident can run
# behind it. No reload: nginx looks for the file on every request (one stat()); removing it
# reopens. The plain-HTTP server, the container's health check with it, is not affected, so
# the orchestrator keeps the edge running.
map $uri $arkray_maintenance_answer {
    "~*^/api/"  @arkray_maintenance_api;
    default     @arkray_maintenance_page;
}
# Addresses let through while the switch is on, to try the application before reopening:
# one host each (a /32 or /128), never an office's shared address or another proxy's
# (everyone behind it would be let in). Matched on $remote_addr, the address the edge's own
# connection comes from: a client's X-Forwarded-For can't claim one. Behind another load
# balancer only once nginx's real_ip takes the client address from it
# (docs/operations.md#edge-rate-limits); otherwise every client carries the balancer's
# address. Empty in the repository; a change needs `nginx -s reload`.
geo $arkray_maintenance_hold {
    default 1;
    # 203.0.113.7/32 0;  # example: the operator's workstation
}

# No keepalive to the API: gunicorn's sync workers close every connection anyway.
upstream arkray_api {
    zone arkray_api 64k;
    server backend:8000 resolve;
}
upstream arkray_web {
    zone arkray_web 64k;
    server frontend:3000 resolve;
    keepalive 16;
}

server {
    listen 8080;
    access_log /var/log/nginx/access.log arkray;
    # Plain HTTP only redirects (the application also refuses to serve insecurely), to the one
    # public name (production: https://crm.example.com$request_uri), never the client's Host:
    # a 308 is cacheable, and an unchecked Host in it sends a poisoned cache's readers
    # anywhere (adversarial review of 73ff1e3, hardening).
    location / { return 308 https://localhost:8443$request_uri; }
    # The container's health check (nginx itself, not what it proxies); loopback only. An
    # `if`, not allow/deny: `return` answers before the access phase ever runs.
    location = /edge-health {
        access_log off;
        if ($remote_addr != "127.0.0.1") {
            return 404;
        }
        default_type text/plain;
        return 200 "ok\n";
    }
}

# Any other host name: no certificate, no page.
server {
    listen 8443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;  # the public host name in production
    access_log /var/log/nginx/access.log arkray;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    # Protocols, suites and no tickets: for every server, at the top of this file.
    ssl_session_cache shared:arkray_tls:10m;

    # JSON bodies only (attachments have their own location below); Django refuses anything
    # over 2.5 MB anyway.
    client_max_body_size 1m;
    # Bodies up to this size stay in memory, never reach a temp area, and take no body slot
    # ($arkray_spooled_body, L13). Written out: nginx's default depends on the platform.
    client_body_buffer_size 16k;
    # Their temp area (P2-2, above): a tmpfs of its own (40 MB, compose.production.yml), so
    # a flood of JSON bodies can't take the uploads' and downloads' area under
    # /var/cache/nginx. Bodies up to 16 KB (client_body_buffer_size) never reach it.
    client_body_temp_path /var/cache/nginx-body;
    # Per client, every location (H-1, above): requests in flight per address; bodies that can
    # reach a temp area per session (per address without one), and per address together
    # (L13). A location with its own limit_conn repeats these lines: nginx doesn't inherit
    # them into a location that has its own.
    limit_conn arkray_conn 256;
    limit_conn arkray_body 8;
    limit_conn arkray_body_address 16;
    limit_conn arkray_small_body 128;
    # No one response holds more than a quarter of the temp area (H-1). Every attachment
    # (ATTACHMENT_MAX_BYTES, 10 MB) still fits whole, so a download to a slow client frees its
    # gunicorn worker as fast as Django can send it; data exports, larger, have their own
    # location and spool below. Not 0 (the audit's suggestion): then every slow download
    # holds one of gunicorn's 8 sync workers until it ends, and the 30 s worker timeout cuts
    # it short (with a 200 already sent) on a slow line.
    proxy_max_temp_file_size 16m;
    # Once, for pages and API alike (Django's own copy is hidden below). Add
    # `; includeSubDomains` (and `preload`) only when every subdomain is served over HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Every response names its request, including the errors nginx answers itself (a user
    # quotes it to support; production readiness review). Django's copy is the same id
    # (TRUST_INCOMING_REQUEST_ID) and is hidden below, so it is sent once. A location with
    # its own add_header repeats both lines: nginx doesn't inherit them into it.
    add_header X-Request-ID $request_id always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Real-IP $remote_addr;
    # Request headers only a proxy or Next.js itself sets, never a client (adversarial review
    # of 73ff1e3, hardening): an empty value drops them. X-Forwarded-Host and -Port would make
    # the web tier build URLs for another host; X-Middleware-*, X-Nextjs-*, X-Invoke-* and the
    # matched-path headers are Next.js's internal signals (CVE-2025-29927 skipped middleware
    # with x-middleware-subrequest). Next 16's names; the browser sends none of them. Review
    # round 1 (INFRA-7) added the other forwarding headers (Forwarded, X-Forwarded-Ssl and
    # friends), the URL-rewriting ones (X-Original-URL, X-Rewrite-URL), method overrides and
    # Next's resume, revalidation and server-action headers (pages take no POST, there are no
    # actions); X-Real-IP is set to the connection's own address, like X-Forwarded-For.
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Middleware-Subrequest "";
    proxy_set_header X-Middleware-Prefetch "";
    proxy_set_header X-Middleware-Invoke "";
    proxy_set_header X-Middleware-Next "";
    proxy_set_header X-Middleware-Rewrite "";
    proxy_set_header X-Middleware-Redirect "";
    proxy_set_header X-Middleware-Refresh "";
    proxy_set_header X-Middleware-Skip "";
    proxy_set_header X-Middleware-Set-Cookie "";
    proxy_set_header X-Middleware-Override-Headers "";
    proxy_set_header X-Nextjs-Data "";
    proxy_set_header X-Nextjs-Matched-Path "";
    proxy_set_header X-Nextjs-Rewritten-Path "";
    proxy_set_header X-Nextjs-Rewritten-Query "";
    proxy_set_header X-Nextjs-Request-Id "";
    proxy_set_header X-Nextjs-Html-Request-Id "";
    proxy_set_header X-Nextjs-Stale-Time "";
    proxy_set_header X-Nextjs-Prerender "";
    proxy_set_header X-Nextjs-Postponed "";
    proxy_set_header X-Nextjs-Cache "";
    proxy_set_header X-Nextjs-Rewrite "";
    proxy_set_header X-Nextjs-Redirect "";
    proxy_set_header X-Nextjs-Action-Not-Found "";
    proxy_set_header X-Nextjs-Deployment-Id "";
    proxy_set_header X-Matched-Path "";
    proxy_set_header X-Now-Route-Matches "";
    proxy_set_header X-Invoke-Path "";
    proxy_set_header X-Invoke-Query "";
    proxy_set_header X-Invoke-Output "";
    proxy_set_header X-Invoke-Status "";
    proxy_set_header X-Invoke-Error "";
    proxy_set_header X-Forwarded-Ssl "";
    proxy_set_header X-Forwarded-Protocol "";
    proxy_set_header X-Forwarded-Server "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Original-URL "";
    proxy_set_header X-Rewrite-URL "";
    proxy_set_header X-Middleware-Subrequest-Id "";
    proxy_set_header Next-Resume "";
    proxy_set_header X-Next-Resume-State-Length "";
    proxy_set_header X-Prerender-Revalidate "";
    proxy_set_header X-Prerender-Revalidate-If-Generated "";
    proxy_set_header X-HTTP-Method-Override "";
    proxy_set_header X-HTTP-Method "";
    proxy_set_header X-Method-Override "";
    proxy_set_header Next-Action "";
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Request-ID;
    proxy_connect_timeout 5s;
    # Longer than gunicorn's 30 s worker timeout, so Django answers (or times out) first.
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;

    # Emergency maintenance (the map and geo above). In the server's rewrite phase, before a
    # location is chosen: every request, whatever its route or limits (a body is discarded,
    # never spooled).
    # The bare `return 503` goes through the error_page below to the named answer for its
    # route (a named location skips this phase: no loop). Locations with error pages of their
    # own don't inherit it; those without (the session check, /health/, the named answers)
    # never answer 503 themselves, and Django's own 503s pass unchanged as before.
    set $arkray_maintenance 0;
    if (-f /etc/nginx/maintenance/on) {
        set $arkray_maintenance $arkray_maintenance_hold;
    }
    if ($arkray_maintenance) {
        return 503;
    }
    error_page 503 = $arkray_maintenance_answer;

    # Next.js's image optimizer: the application uses no next/image, and next.config.ts turns
    # it off (images.unoptimized: Next answers 404 too). Never reachable from outside, in any
    # case (`/_NEXT/image` reached the web tier: review round 1): it fetches and resizes on
    # request (adversarial review of 73ff1e3, hardening). The first regex location.
    location ~* ^/_next/image {
        return 404;
    }

    # Note attachments: the one route taking a larger body (a file, ATTACHMENT_MAX_BYTES,
    # 10 MB by default, plus headroom). nginx buffers it (to disk) before Django sees it, so a
    # slow upload never holds a web worker; Django still counts every byte and refuses more
    # than its limit. Listed first: regex locations match in order. The buffer is the capped
    # temp area (H-1): at most 4 uploads in flight per client, each dropped after 10 s without
    # a byte; with the area full, an upload is refused (503) and nothing else grows.
    # And only for a signed-in user: auth_request runs in nginx's access phase, before the
    # body is read, and asks Django whether the request's session is valid (the internal
    # location below). No session: 401 in the API's envelope, and the body is discarded
    # unread, never spooled. A failed or unexpected check fails closed (503). So nobody
    # can fill the upload area without an account (independent review of H-1).
    location ~* ^/api/v1/workspaces/[^/]+/activities/[^/]+/attachments$ {
        client_max_body_size 11m;
        error_page 413 = @arkray_too_large;
        error_page 429 = @arkray_rate_limited;
        error_page 500 502 504 = @arkray_api_unavailable;
        error_page 401 = @arkray_not_authenticated;
        error_page 403 = @arkray_permission_denied;
        auth_request /_arkray/session;
        client_body_temp_path /var/cache/nginx/client_temp;
        # Not the JSON bodies' zones (review round 1, INFRA-3: they are counted before the
        # session check, so forged sessions' JSON trickles blocked co-workers' uploads): the
        # upload area and its zone are the uploads' own.
        limit_conn arkray_conn 256;
        limit_conn arkray_small_body 128;
        limit_conn arkray_upload 4;
        limit_req zone=arkray_api_session burst=200 nodelay;
        limit_req zone=arkray_api_anonymous burst=100 nodelay;
        limit_req zone=arkray_api_address burst=1000 nodelay;
        proxy_pass http://arkray_api;
    }

    # The upload's session check: GET /api/v1/auth/me with the browser's own headers (its
    # session cookie, Sec-Fetch-Site), never its body. That view reads the session and the
    # user and writes nothing (no audit event); it answers 200 to any signed-in session, 401
    # to none; anything else (a cross-site request's 404, a throttle's 429, a timeout) is an
    # error to auth_request, so the upload gets 503. Internal: a client asking for this path
    # gets 404. proxy_set_header here replaces the server's lines, so they are repeated.
    location = /_arkray/session {
        internal;
        # The upload's own limit (11m) was checked already; here the server's 1m would refuse
        # every upload's check with 413 (found live), and this location reads no body.
        client_max_body_size 0;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Content-Type "";
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Middleware-Subrequest "";
        proxy_set_header X-Middleware-Prefetch "";
        proxy_set_header X-Middleware-Invoke "";
        proxy_set_header X-Middleware-Next "";
        proxy_set_header X-Middleware-Rewrite "";
        proxy_set_header X-Middleware-Redirect "";
        proxy_set_header X-Middleware-Refresh "";
        proxy_set_header X-Middleware-Skip "";
        proxy_set_header X-Middleware-Set-Cookie "";
        proxy_set_header X-Middleware-Override-Headers "";
        proxy_set_header X-Nextjs-Data "";
        proxy_set_header X-Nextjs-Matched-Path "";
        proxy_set_header X-Nextjs-Rewritten-Path "";
        proxy_set_header X-Nextjs-Rewritten-Query "";
        proxy_set_header X-Nextjs-Request-Id "";
        proxy_set_header X-Nextjs-Html-Request-Id "";
        proxy_set_header X-Nextjs-Stale-Time "";
        proxy_set_header X-Nextjs-Prerender "";
        proxy_set_header X-Nextjs-Postponed "";
        proxy_set_header X-Nextjs-Cache "";
        proxy_set_header X-Nextjs-Rewrite "";
        proxy_set_header X-Nextjs-Redirect "";
        proxy_set_header X-Nextjs-Action-Not-Found "";
        proxy_set_header X-Nextjs-Deployment-Id "";
        proxy_set_header X-Matched-Path "";
        proxy_set_header X-Now-Route-Matches "";
        proxy_set_header X-Invoke-Path "";
        proxy_set_header X-Invoke-Query "";
        proxy_set_header X-Invoke-Output "";
        proxy_set_header X-Invoke-Status "";
        proxy_set_header X-Invoke-Error "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Forwarded-Protocol "";
        proxy_set_header X-Forwarded-Server "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Original-URL "";
        proxy_set_header X-Rewrite-URL "";
        proxy_set_header X-Middleware-Subrequest-Id "";
        proxy_set_header Next-Resume "";
        proxy_set_header X-Next-Resume-State-Length "";
        proxy_set_header X-Prerender-Revalidate "";
        proxy_set_header X-Prerender-Revalidate-If-Generated "";
        proxy_set_header X-HTTP-Method-Override "";
        proxy_set_header X-HTTP-Method "";
        proxy_set_header X-Method-Override "";
        proxy_set_header Next-Action "";
        proxy_read_timeout 10s;
        proxy_pass http://arkray_api/api/v1/auth/me;
    }

    # A data export's ZIP (EXPORT_MAX_BYTES, 100 MB), for the administrator who asked for it
    # (independent review of H-1, P2-1): with the 16 MB cap above, nginx read the rest from
    # gunicorn at the client's pace, the sync worker hit its 30 s timeout and was killed, and
    # a slow line got a 200 with a truncated ZIP (41 of 60 MB at 1 MB/s). Spooled whole here,
    # on a disk volume (not memory: compose.production.yml, edge-export-spool), only once
    # Django has answered: an anonymous request gets its 401 and nothing is spooled. Bounded:
    # 2 downloads in flight per client, 4 in all (4 x 112 MB on that disk); no request body
    # (a declared one is refused 413 before it is counted).
    location ~* ^/api/v1/admin/privacy/exports/[^/]+/download$ {
        client_max_body_size 1;
        error_page 413 = @arkray_too_large;
        error_page 429 = @arkray_rate_limited;
        error_page 500 502 504 = @arkray_api_unavailable;
        limit_conn arkray_conn 256;
        limit_conn arkray_body 8;
        limit_conn arkray_body_address 16;
        limit_conn arkray_small_body 128;
        limit_conn arkray_export 2;
        limit_conn arkray_export_all 4;
        limit_req zone=arkray_api_session burst=200 nodelay;
        limit_req zone=arkray_api_anonymous burst=100 nodelay;
        limit_req zone=arkray_api_address burst=1000 nodelay;
        proxy_temp_path /var/cache/nginx-exports;
        proxy_max_temp_file_size 112m;
        proxy_pass http://arkray_api;
    }

    # Sign-in, password reset and invitations (never the signed-in routes such as /auth/me,
    # which a whole office calls from one address): see limit_req_zone above. The
    # refusal is the API's own JSON shape, with Retry-After, so the web app shows its message.
    # The API's own rates too (a location with its own limit_req inherits none).
    location ~* ^/api/v1/auth/(login|password-reset|invitations) {
        limit_req zone=arkray_auth burst=30 nodelay;
        limit_req zone=arkray_api_session burst=200 nodelay;
        limit_req zone=arkray_api_anonymous burst=100 nodelay;
        limit_req zone=arkray_api_address burst=1000 nodelay;
        error_page 429 = @arkray_rate_limited;
        error_page 413 = @arkray_too_large;
        error_page 500 502 504 = @arkray_api_unavailable;
        proxy_pass http://arkray_api;
    }

    # Case-insensitive, so /API/... reaches Django (which answers 404) instead of Next.js's
    # case-insensitive rewrite (Phase 11 review). Rates per session, per address without one,
    # and per address in all (L2, above).
    location ~* ^/api/ {
        limit_req zone=arkray_api_session burst=200 nodelay;
        limit_req zone=arkray_api_anonymous burst=100 nodelay;
        limit_req zone=arkray_api_address burst=1000 nodelay;
        error_page 429 = @arkray_rate_limited;
        error_page 413 = @arkray_too_large;
        error_page 500 502 504 = @arkray_api_unavailable;
        proxy_pass http://arkray_api;
    }


    # Errors nginx answers itself on API routes, in the API's own JSON envelope with the
    # request id (only nginx's own: Django's responses, its 503s included, pass unchanged).
    location @arkray_api_unavailable {
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header Retry-After 5 always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Request-ID $request_id always;
        add_header Cache-Control no-store always;
        return 503 '{"error":{"code":"service_unavailable","message":"Arkray CRM is temporarily unavailable. Please try again shortly.","details":null,"request_id":"$request_id"}}';
    }

    location @arkray_too_large {
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Request-ID $request_id always;
        add_header Cache-Control no-store always;
        return 413 '{"error":{"code":"file_too_large","message":"The request is too large.","details":null,"request_id":"$request_id"}}';
    }

    location @arkray_rate_limited {
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header Retry-After 2 always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Request-ID $request_id always;
        add_header Cache-Control no-store always;
        return 429 '{"error":{"code":"rate_limited","message":"Too many requests. Try again in a moment.","details":null,"request_id":"$request_id"}}';
    }

    # The upload's session check refused it (auth_request above): Django's own answers.
    location @arkray_not_authenticated {
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header WWW-Authenticate 'Session realm="arkray"' always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Request-ID $request_id always;
        add_header Cache-Control no-store always;
        return 401 '{"error":{"code":"not_authenticated","message":"Authentication credentials were not provided.","details":null,"request_id":"$request_id"}}';
    }

    location @arkray_permission_denied {
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Request-ID $request_id always;
        add_header Cache-Control no-store always;
        return 403 '{"error":{"code":"permission_denied","message":"You do not have permission to perform this action.","details":null,"request_id":"$request_id"}}';
    }

    location /health/ {
        return 404;
    }

    location / {
        if ($arkray_page_refused) {
            return 405;
        }
        # A body can't reach a page (an HTTP/2 one is undeclared): refused past one byte.
        client_max_body_size 1;
        error_page 429 = @arkray_web_rate_limited;
        error_page 500 502 504 = @arkray_web_unavailable;
        proxy_pass http://arkray_web;
    }

    # The web tier (Next.js) unreachable or too slow: a minimal page naming the request (a
    # user quotes it to support), never nginx's own page with its version-free banner. No
    # script, style or image may load from it.
    location @arkray_web_unavailable {
        default_type text/html;
        charset utf-8;
        add_header Retry-After 5 always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Request-ID $request_id always;
        add_header Cache-Control no-store always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        return 503 '<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Arkray CRM is temporarily unavailable</title></head>
<body><h1>Arkray CRM is temporarily unavailable</h1><p>Please try again in a moment.</p><p>Reference: $request_id</p></body></html>
';
    }

    # One client over its share of requests in flight on pages (limit_conn above, H-1): the
    # same kind of page, 429.
    location @arkray_web_rate_limited {
        default_type text/html;
        charset utf-8;
        add_header Retry-After 2 always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Request-ID $request_id always;
        add_header Cache-Control no-store always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        return 429 '<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Too many requests</title></head>
<body><h1>Too many requests</h1><p>Please try again in a moment.</p><p>Reference: $request_id</p></body></html>
';
    }

    # Emergency maintenance's answers (the switch above). Retry-After is the erasure ledger
    # gate's minute: over 4 s, so the web app shows its message instead of retrying.
    location @arkray_maintenance_api {
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header Retry-After 60 always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Request-ID $request_id always;
        add_header Cache-Control no-store always;
        return 503 '{"error":{"code":"service_unavailable","message":"Arkray CRM is down for maintenance. Please try again later.","details":null,"request_id":"$request_id"}}';
    }

    # The page: no script, style or image, nothing to load from the application.
    location @arkray_maintenance_page {
        default_type text/html;
        charset utf-8;
        add_header Retry-After 60 always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Request-ID $request_id always;
        add_header Cache-Control no-store always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        return 503 '<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Arkray CRM is down for maintenance</title></head>
<body><h1>Arkray CRM is down for maintenance</h1><p>Please try again later.</p><p>Reference: $request_id</p></body></html>
';
    }
}
