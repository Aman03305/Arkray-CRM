# Arkray CRM: reference edge proxy (docs/deployment.md#reverse-proxy).
#
# One origin for pages and API: /api goes straight to Django (gunicorn), everything else to
# Next.js. TLS terminates here. The rules the application depends on:
#   - X-Forwarded-For and X-Forwarded-Proto are OVERWRITTEN, never passed through (client IPs
#     drive rate limits and the audit trail; set TRUSTED_PROXY_COUNT=1 behind this proxy);
#   - X-Request-ID is minted here (set TRUST_INCOMING_REQUEST_ID=true);
#   - the access log has no query strings (search terms travel in them, R61) and no
#     one-time secrets (invitation and password-reset links), and no Referer; the error log
#     keeps critical events only, because nginx writes the whole request line (query string
#     and token included) into every error it logs (Phase 11 review);
#   - /health/* is not routed: probes and the metrics scraper reach the pods directly;
#   - requests for any other host name end at the TLS handshake.
# The ports (8080/8443) and certificate paths are the local verification stack's
# (infrastructure/compose.production.yml); use 80/443 and real certificates in production.

error_log /var/log/nginx/error.log crit;

map $uri $arkray_log_path {
    ~^/activate/        /activate/[redacted];
    ~^/reset-password/  /reset-password/[redacted];
    default             $uri;
}

# The upstream's address, status and time: with the error log at `crit`, they are how a
# 502/504 is attributed to the API or the web tier (whole-software audit).
log_format arkray '$remote_addr [$time_iso8601] "$request_method $arkray_log_path '
                  '$server_protocol" $status $body_bytes_sent $request_time '
                  '"$http_user_agent" $request_id '
                  'upstream=$upstream_addr upstream_status=$upstream_status '
                  'upstream_time=$upstream_response_time';

# Upstream names are re-resolved while nginx runs (`resolve`, nginx 1.27.3+): replaced
# containers get new addresses, and an address resolved once at startup turned every API
# request into a 502 after the backend was redeployed (Phase 11). 127.0.0.11 is Docker's
# DNS; use the platform's resolver elsewhere (a Kubernetes Service's address is stable).
resolver 127.0.0.11 valid=10s ipv6=off;

# No keepalive to the API: gunicorn's sync workers close every connection anyway.
upstream arkray_api {
    zone arkray_api 64k;
    server backend:8000 resolve;
}
upstream arkray_web {
    zone arkray_web 64k;
    server frontend:3000 resolve;
    keepalive 16;
}

server {
    listen 8080;
    server_tokens off;
    access_log /var/log/nginx/access.log arkray;
    # Plain HTTP only redirects (the application also refuses to serve insecurely).
    location / { return 308 https://$host:8443$request_uri; }
}

# Any other host name: no certificate, no page.
server {
    listen 8443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;  # the public host name in production
    server_tokens off;
    access_log /var/log/nginx/access.log arkray;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:arkray_tls:10m;

    # JSON bodies only (attachments have their own location below); Django refuses anything
    # over 2.5 MB anyway.
    client_max_body_size 1m;
    # Once, for pages and API alike (Django's own copy is hidden below). Add
    # `; includeSubDomains` (and `preload`) only when every subdomain is served over HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header Strict-Transport-Security;
    proxy_connect_timeout 5s;
    # Longer than gunicorn's 30 s worker timeout, so Django answers (or times out) first.
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;

    # Note attachments: the one route taking a larger body (a file, ATTACHMENT_MAX_BYTES,
    # 10 MB by default, plus headroom). nginx buffers it (to disk) before Django sees it, so a
    # slow upload never holds a web worker; Django still counts every byte and refuses more
    # than its limit. Listed first: regex locations match in order.
    location ~* ^/api/v1/workspaces/[^/]+/activities/[^/]+/attachments$ {
        client_max_body_size 11m;
        proxy_pass http://arkray_api;
    }

    # Case-insensitive, so /API/... reaches Django (which answers 404) instead of Next.js's
    # case-insensitive rewrite (Phase 11 review).
    location ~* ^/api/ {
        proxy_pass http://arkray_api;
    }

    location /health/ {
        return 404;
    }

    location / {
        proxy_pass http://arkray_web;
    }
}
