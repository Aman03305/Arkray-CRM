# Arkray CRM: the reference ClamAV daemon (infrastructure/compose.production.yml, R94).
# Mounted read-only over the image's own file (the container's root filesystem is
# read-only, so the image's CLAMD_CONF_* environment rewriting isn't used). Only the worker
# that scans attachments (queue default) can reach port 3310, on a private network.

# clamd refuses a symlink such as /dev/stdout as its log file, so the file is on a small
# tmpfs (the image's own default path), rotated; running in the foreground, clamd prints
# the same lines to the container's output (docker logs), as freshclam does (--stdout).
LogFile /var/log/clamav/clamd.log
LogTime yes
LogClean no
LogFileMaxSize 2M
LogRotate yes

LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# The app streams each file with INSTREAM. These limits hang together; keep
#   ATTACHMENT_MAX_BYTES (10 MB by default; nginx takes at most 11 MB on that route)
#     <= StreamMaxLength <= MaxFileSize <= MaxScanSize
# or files fail closed forever (clamd refuses the stream, or reports a limit exceeded: the
# job retries, the file stays "being checked" and can't be downloaded). MaxFileSize also
# bounds each member clamd unpacks from an archive (docx/xlsx/pptx are zip files): a 10 MB
# spreadsheet's XML can unpack to several times that, so it is as large as MaxScanSize.
# Raise them together.
StreamMaxLength 16M
MaxFileSize 128M
MaxScanSize 128M
# Content beyond any scan limit (MaxScanSize, MaxFiles, MaxRecursion, ...) is reported as
# Heuristics.Limits.Exceeded instead of a quiet OK for a partly scanned file; the app treats
# that as no verdict (the file stays pending, never deleted), so nothing unscanned passes.
AlertExceedsMax yes

# Signature updates (freshclam's NotifyClamd) load the new database beside the old one, so
# scanning never pauses; the container's memory limit allows for both (about 2 x 1.2 GB).
ConcurrentDatabaseReload yes
MaxThreads 4
