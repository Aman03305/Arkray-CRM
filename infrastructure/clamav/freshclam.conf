# Arkray CRM: signature updates for the reference ClamAV daemon (clamd.conf beside this).
# freshclam runs inside the clamav container (the image's init starts it with --stdout, so
# it logs to the container's output) and reaches the ClamAV mirrors over that container's
# own egress network; nothing else is on that network.
DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
DatabaseMirror database.clamav.net
ScriptedUpdates yes
# Tell clamd to load new signatures as soon as they arrive.
NotifyClamd /etc/clamav/clamd.conf
