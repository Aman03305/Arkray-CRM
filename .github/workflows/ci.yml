name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request replaces its running checks. On main every commit runs to
# the end, in a group of its own: a release needs CI's verdict on exactly the commit it
# publishes (.github/workflows/release.yml), and one group per branch would cancel a waiting
# run whenever a third commit arrived.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned to a commit, the exact release it was taken from in the
# comment (checked with `git ls-remote --tags`): a moved tag can't change what runs here
# (Phase 11). Move them deliberately, in every workflow at once
# (tests/architecture/test_ci_workflow.py). No checkout keeps the token in .git/config: nothing
# here pushes, and the tests and dependencies that run afterwards have no use for it.

jobs:
  # Secrets in the repository: every commit, not just the latest tree, since a secret
  # removed later is still in the history (secret-exposure audit). Reviewed test values are
  # listed in .gitleaksignore. The binary is pinned by version and checksum. A finding is
  # reported with its file, line, rule and fingerprint, the value itself redacted.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the history for secrets
        run: |
          set -euo pipefail
          version=8.30.1
          sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "${sha256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --verbose --no-banner --exit-code 1 .

  # The workflows themselves: expressions, permissions, job dependencies and action inputs
  # (actionlint), and shellcheck on every `run:` script. The image is pinned by digest.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Lint the workflows
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

  # The production-shaped stack can't take a secret from a development file (adversarial
  # review of 73ff1e3, M4: `.env.example`'s superuser password once filled its
  # `${POSTGRES_PASSWORD:?}`). With `.env.example` copied to `.env`, as in a developer's
  # checkout, and every secret the overlay requires given but one, Compose must refuse,
  # naming the one left out, for each; with all of them it is a valid configuration (so
  # each refusal is that name's, not a broken file). Configuration only: nothing is built
  # or started. scripts/ci-local.sh runs the same check (tests/architecture/test_ci_workflow.py).
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Refuse development credentials in the production stack
        run: |
          set -euo pipefail
          cp .env.example .env
          files=(-p arkray-ci-production -f docker-compose.yml -f infrastructure/compose.production.yml --profile app)
          mapfile -t required < <(grep -v '^ *#' infrastructure/compose.production.yml |
            grep -oE '\$\{[A-Z][A-Z0-9_]*:\?' | sed -E 's/^\$\{//; s/:\?$//' | sort -u)
          [[ ${#required[@]} -ge 7 ]] || { echo "::error::the overlay requires only ${#required[@]} secrets"; exit 1; }
          # Every required secret exported (a random throwaway value) but $1, which is unset.
          configure() {
            local name value
            for name in "${required[@]}"; do
              value="$(openssl rand -hex 32)"
              if [[ $name == "$1" ]]; then unset "$name"; else export "$name=$value"; fi
            done
            docker compose "${files[@]}" config --quiet
          }
          for missing in "${required[@]}"; do
            if (configure "$missing") 2> "$RUNNER_TEMP/compose.err"; then
              echo "::error::the production stack took $missing from the development .env"
              exit 1
            fi
            grep -q "$missing" "$RUNNER_TEMP/compose.err" || { cat "$RUNNER_TEMP/compose.err"; exit 1; }
          done
          (configure "")
          echo "refused for each of ${#required[@]} production secrets: ${required[*]}"

  backend:
    runs-on: ubuntu-latest
    # The full suite takes about 8 minutes on a fast workstation; hosted runners are slower.
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-trixie@sha256:40d828eda66737aaacb934387a337babf1455ebd56e9bdd13fc08e211257c972
        env:
          POSTGRES_DB: arkray
          POSTGRES_USER: arkray
          POSTGRES_PASSWORD: arkray_dev_only_password
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U arkray -d arkray"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      # --locked, not --frozen: uv.lock must also match pyproject.toml. A dependency edited
      # without `uv lock` fails here, instead of the images building from a stale lockfile
      # (their `uv sync --frozen` trusts it).
      - run: uv sync --locked
      # The pinned embedding model (SHA-256 verified), so the real-model tests run here
      # instead of skipping (backend/arkray/ai/tests/test_local_model.py).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: backend/.models
          key: embedding-model-${{ hashFiles('backend/arkray/ai/model_files.py') }}
      - run: uv run python manage.py ai_fetch_model
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run lint-imports
      - run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: uv run pytest --cov --cov-report=term-missing:skip-covered
      - name: Dependency audit
        run: |
          uv export --frozen --no-dev --no-hashes --format requirements-txt > /tmp/requirements.txt
          uv run pip-audit --progress-spinner off -r /tmp/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          # The pnpm version comes from "packageManager", which lives in frontend/, not the root.
          package_json_file: frontend/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Generated API types must match the backend's committed OpenAPI contract.
      - run: pnpm api:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: docker build -t arkray-backend:ci backend
      - run: docker build --build-arg API_ORIGIN=http://backend:8000 -t arkray-frontend:ci frontend
      # The images start as production runs them: production settings, a read-only root
      # filesystem, no capabilities. (No database for the servers: the startup role check
      # only warns when it can't connect; readiness would report the database.)
      # Known vulnerabilities in what the images contain: OS packages and every bundled language
      # package (the final audit's R107 findings were npm inside the base image, invisible to
      # `pnpm audit`). A HIGH or CRITICAL finding with a fix available fails the build; one the
      # distribution has not fixed yet (no fixed version) is listed, not blocking, and judged
      # for reachability in docs/risk-register.md. The scanner image is pinned by digest; its
      # vulnerability database is downloaded once per job into a volume the six scans share.
      # Secrets in any layer (a key copied in, an ENV or build argument) also fail the build:
      # an image keeps every layer (secret-exposure audit).
      # The release workflow runs this step and the next one unchanged on the images it
      # publishes (tests/architecture/test_ci_workflow.py compares them).
      - name: Scan the images for known vulnerabilities and secrets
        run: |
          set -euo pipefail
          trivy=aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e
          scan=(docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache "$trivy" image --skip-version-check)
          for image in arkray-backend:ci arkray-frontend:ci; do
            echo "== $image: everything HIGH or CRITICAL (informational)"
            "${scan[@]}" --scanners vuln --severity HIGH,CRITICAL "$image"
            echo "== $image: fixable HIGH or CRITICAL (blocking)"
            "${scan[@]}" --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
            echo "== $image: secrets, any severity (blocking)"
            "${scan[@]}" --scanners secret --exit-code 1 "$image"
          done
      - name: Smoke-test the images
        run: |
          set -euo pipefail
          prod_env=(
            -e DJANGO_SECRET_KEY="ci-image-smoke-$(openssl rand -hex 32)"
            -e DJANGO_ALLOWED_HOSTS=localhost
            -e DATABASE_URL=postgres://arkray_app:x@127.0.0.1:5432/arkray
            -e CELERY_BROKER_URL=redis://:x@127.0.0.1:6379/0
            -e REDIS_CACHE_URL=redis://:x@127.0.0.1:6379/1
            -e TRUSTED_PROXY_COUNT=1 -e TRUSTED_PROXY_ADDRESSES=10.0.0.10
            -e APP_BASE_URL=https://crm.example.com
            -e EMAIL_URL=smtp+tls://user:x@smtp.example.com:587
            -e ERASURE_LEDGER_URL=file:///tmp/erasure-ledger
            -e ERASURE_LEDGER_KEY="ci-image-smoke-ledger-$(openssl rand -hex 32)"
            -e DEFAULT_FROM_EMAIL=no-reply@crm.example.com
            -e ATTACHMENT_SCANNER_WAIVED=true
          )
          hardened=(--read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true)
          docker run --rm "${prod_env[@]}" "${hardened[@]}" arkray-backend:ci python manage.py check --deploy
          docker run -d --name api "${prod_env[@]}" "${hardened[@]}" -p 8000:8000 arkray-backend:ci
          docker run -d --name web "${hardened[@]}" --tmpfs /app/.next/cache:uid=10001,gid=10001 -p 3000:3000 arkray-frontend:ci
          for _ in $(seq 1 30); do curl -fsS http://localhost:8000/health/live && break; sleep 2; done
          # Outside the loop, whose own status is always the last sleep's: the API is up.
          curl -fsS http://localhost:8000/health/live
          curl -fsS -o /dev/null http://localhost:3000/login
          docker logs api 2>&1 | tail -20
          # A crash prints a traceback; structured lines carry their level.
          if docker logs api 2>&1 | grep -E '\[ERROR\]|Traceback|Read-only file system|"level": "(ERROR|CRITICAL)"'; then
            echo "the API logged errors" >&2
            exit 1
          fi
          # A release on a new database (docs/deployment.md#release-process, steps 2-4) with
          # this image: infrastructure/postgres/roles.sql as the superuser, every migration
          # from nothing as arkray_owner (no superuser: a migration that needs more fails here,
          # not in production; the test suite migrates as a superuser), the grant, nothing left
          # unapplied, and the release check as arkray_app. The passwords are random and reach
          # the containers through the environment, never a command line; DATABASE_URL given
          # last replaces prod_env's.
          export POSTGRES_PASSWORD OWNER_PASSWORD APP_PASSWORD
          POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          OWNER_PASSWORD="$(openssl rand -hex 24)"
          APP_PASSWORD="$(openssl rand -hex 24)"
          docker run -d --name db -e POSTGRES_USER=arkray -e POSTGRES_DB=postgres -e POSTGRES_PASSWORD \
            pgvector/pgvector:0.8.7-pg16-trixie@sha256:40d828eda66737aaacb934387a337babf1455ebd56e9bdd13fc08e211257c972
          # TCP answers only once the image's first-start initialisation is over.
          for _ in $(seq 1 30); do docker exec db pg_isready -q -h 127.0.0.1 -U arkray && break; sleep 2; done
          docker exec -i -e OWNER_PASSWORD -e APP_PASSWORD db \
            psql -q -U arkray -d postgres -v database=arkray -f - < infrastructure/postgres/roles.sql
          on_db=(--network container:db)
          DATABASE_URL="postgres://arkray_owner:${OWNER_PASSWORD}@127.0.0.1:5432/arkray" \
            docker run --rm "${prod_env[@]}" -e DATABASE_URL "${hardened[@]}" "${on_db[@]}" arkray-backend:ci \
            sh -c 'python manage.py migrate --noinput && python manage.py grant_app_privileges arkray_app && python manage.py migrate --check'
          DATABASE_URL="postgres://arkray_app:${APP_PASSWORD}@127.0.0.1:5432/arkray" \
            docker run --rm "${prod_env[@]}" -e DATABASE_URL "${hardened[@]}" "${on_db[@]}" arkray-backend:ci \
            python manage.py check --deploy --database default
      # The production stack's credential guard (infrastructure/compose.production.yml,
      # config/credentials.py; M4), in the image as Compose runs it: the published development
      # password refused, freshly generated secrets accepted. Values through the environment.
      - name: Check the credential guard in the image
        run: |
          set -euo pipefail
          names=(ARKRAY_PROD_DB_SUPERUSER_PASSWORD ARKRAY_PROD_DB_OWNER_PASSWORD ARKRAY_PROD_DB_APP_PASSWORD
            ARKRAY_PROD_REDIS_PASSWORD ARKRAY_PROD_DJANGO_SECRET_KEY ARKRAY_PROD_METRICS_TOKEN ARKRAY_PROD_ERASURE_LEDGER_KEY)
          guard=(docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true)
          for name in "${names[@]}"; do
            value="$(openssl rand -hex 32)"
            export "$name=$value"
            guard+=(-e "$name")
          done
          "${guard[@]}" arkray-backend:ci python -m config.credentials
          export ARKRAY_PROD_DB_SUPERUSER_PASSWORD=arkray_dev_only_password
          if "${guard[@]}" arkray-backend:ci python -m config.credentials; then
            echo "::error::the guard accepted the published development password" >&2
            exit 1
          fi
