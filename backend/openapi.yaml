  /api/v1/workspaces/{workspace}/opportunities/{opportunity_id}/move:
    post:
      operationId: opportunities_move
      description: |-
        The one stage-transition operation (drag and drop and "Move to stage" alike):
        open stages, won, lost, and reopening a closed opportunity into an open stage.
      parameters:
      - in: path
        name: opportunity_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace
        schema:
