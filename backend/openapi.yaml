      - preview
      - preview_truncated
      - starts_at
      - status
      - title
      - type
    TimelineEntry:
      type: object
      description: |-
        One event. `details` is the event's snapshot (status and stage names as they were,
        people as {id, full_name, is_active}, a meeting's times when it was scheduled); the
        activity and opportunity are the live records, shown only because they are visible.
      properties:
        id:
          type: string
          example: 3f9a1c0b7d2e4a6c8e10
          readOnly: true
        kind:
          $ref: '#/components/schemas/TimelineKindEnum'
        occurred_at:
          type: string
          format: date-time
        actor:
          allOf:
          - $ref: '#/components/schemas/UserRef'
          nullable: true
          description: Null when the system acted.
        details:
          type: object
          additionalProperties: true
          readOnly: true
        activity:
          allOf:
          - $ref: '#/components/schemas/TimelineActivity'
          nullable: true
          readOnly: true
        opportunity:
          allOf:
          - $ref: '#/components/schemas/ActivityOpportunityRef'
          nullable: true
          readOnly: true
      required:
      - activity
      - actor
      - details
      - id
      - kind
      - occurred_at
      - opportunity
    TimelineKindEnum:
      enum:
      - lead.created
      - lead.status_changed
      - lead.reassigned
      - lead.archived
      - lead.restored
      - opportunity.created
      - opportunity.stage_changed
      - opportunity.won
      - opportunity.lost
      - opportunity.reopened
      - task.created
      - task.completed
      - task.cancelled
      - task.reopened
      - meeting.scheduled
      - meeting.rescheduled
      - meeting.completed
      - meeting.cancelled
      - meeting.reopened
      - note.added
      type: string
      description: |-
        * `lead.created` - Lead created
        * `lead.status_changed` - Lead status changed
        * `lead.reassigned` - Lead reassigned
        * `lead.archived` - Lead archived
        * `lead.restored` - Lead restored
        * `opportunity.created` - Opportunity created
        * `opportunity.stage_changed` - Opportunity stage changed
        * `opportunity.won` - Opportunity won
        * `opportunity.lost` - Opportunity lost
        * `opportunity.reopened` - Opportunity reopened
        * `task.created` - Task created
        * `task.completed` - Task completed
        * `task.cancelled` - Task cancelled
        * `task.reopened` - Task reopened
        * `meeting.scheduled` - Meeting scheduled
        * `meeting.rescheduled` - Meeting rescheduled
        * `meeting.completed` - Meeting completed
        * `meeting.cancelled` - Meeting cancelled
        * `meeting.reopened` - Meeting reopened
        * `note.added` - Note added
    TimelinePage:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEntry'
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
      required:
      - next
      - previous
      - results
