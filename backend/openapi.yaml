        display_name:
          type: string
          readOnly: true
        organization_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusRef'
          readOnly: true
        owner:
          allOf:
          - $ref: '#/components/schemas/UserRef'
