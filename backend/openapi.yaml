      - first_name
      - role
    UserRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - full_name
      - id
      - is_active
    Viewer:
      type: object
      description: The signed-in user (GET /auth/me and the sign-in response).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        role_label:
          type: string
          readOnly: true
        capabilities:
          type: array
          items:
            type: string
          readOnly: true
        features:
          allOf:
          - $ref: '#/components/schemas/ViewerFeatures'
          readOnly: true
      required:
      - capabilities
      - email
      - features
      - first_name
      - full_name
      - id
      - last_name
      - role
      - role_label
    ViewerFeatures:
      type: object
      description: Deployment-wide features the UI should offer (configuration, not
