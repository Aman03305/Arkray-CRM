      - weighted_value
    OpportunityCreateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        value:
          oneOf:
          - type: string
            pattern: ^[0-9]+(\.[0-9]{1,2})?$
            example: '1250000.00'
          - type: integer
            minimum: 0
          description: Amount in the organisation currency (INR), e.g. "1250000.00".
        probability:
          oneOf:
          - type: string
            pattern: ^[0-9]+(\.[0-9]{1,2})?$
            example: '1250000.00'
          - type: integer
            minimum: 0
          nullable: true
          description: A percentage (0-100). Omit (or null) to use the stage's default.
        expected_close_date:
          type: string
          format: date
          nullable: true
        description:
          type: string
          maxLength: 5000
        lead:
          type: string
          format: uuid
          description: The lead (in this workspace) the opportunity is for.
        pipeline:
          type: string
          format: uuid
          description: The default pipeline if omitted.
        stage:
          type: string
          format: uuid
          description: A stage of the pipeline; its first open stage if omitted.
        lost_reason:
          type: string
          maxLength: 500
      required:
      - lead
      - title
      - value
    OpportunityMoveRequest:
      type: object
      properties:
        stage:
          type: string
          format: uuid
          description: An active stage of the opportunity's pipeline.
        version:
          type: integer
          minimum: 1
        lost_reason:
          type: string
          description: Optional, only when moving to a lost stage.
          maxLength: 500
      required:
      - stage
      - version
