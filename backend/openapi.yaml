openapi: 3.0.3
info:
  title: Arkray CRM API
  version: 1.0.0
paths:
  /api/v1/admin/users:
    get:
      operationId: admin_users_list
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
          minLength: 1
          maxLength: 500
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: q
        schema:
          oneOf:
          - type: string
            maxLength: 100
            minLength: 2
          - type: string
            maxLength: 0
      - in: query
        name: role
        schema:
          enum:
          - admin
          - sales_user
          type: string
          minLength: 1
        description: |-
          * `admin` - Admin
          * `sales_user` - User
      - in: query
        name: status
        schema:
          enum:
          - invited
          - active
          - deactivated
          type: string
          minLength: 1
        description: |-
          * `invited` - Invited
          * `active` - Active
          * `deactivated` - Deactivated
      tags:
      - admin
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPage'
          description: ''
    post:
      operationId: admin_users_create
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin/users/{user_id}:
    get:
      operationId: admin_users_retrieve
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    patch:
      operationId: admin_users_partial_update
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin/users/{user_id}/activate:
    post:
      operationId: admin_users_activate_create
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin/users/{user_id}/change-email:
    post:
      operationId: admin_users_change_email_create
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin/users/{user_id}/deactivate:
    post:
      operationId: admin_users_deactivate_create
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin/users/{user_id}/resend-invitation:
    post:
      operationId: admin_users_resend_invitation_create
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/assignees:
    get:
      operationId: assignees_list
      description: Who CRM records can be assigned to (owner pickers). Active users
        only, by name.
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
          minLength: 1
          maxLength: 1000
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 100
      - in: query
        name: q
        schema:
          oneOf:
          - type: string
            maxLength: 100
            minLength: 2
          - type: string
            maxLength: 0
      tags:
      - assignees
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssigneePage'
          description: ''
  /api/v1/auth/csrf:
    get:
      operationId: auth_csrf_retrieve
      description: Issue the CSRF cookie the SPA echoes in X-CSRFToken.
      tags:
      - auth
      security:
      - sessionAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/invitations/accept:
    post:
      operationId: auth_invitations_accept_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
        required: true
      security:
      - sessionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
          description: ''
  /api/v1/auth/invitations/verify:
    post:
      operationId: auth_invitations_verify_create
      description: Who a still-valid invitation link is for. POST so the secret never
        enters a URL.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationTokenRequest'
        required: true
      security:
      - sessionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - sessionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Viewer'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      description: 'Ends the session. Idempotent: signing out without a session is
        a no-op.'
      tags:
      - auth
      security:
      - sessionAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/me:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Viewer'
          description: ''
  /api/v1/auth/password-reset:
    post:
      operationId: auth_password_reset_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - sessionAuth: []
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: auth_password_reset_confirm_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - sessionAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/password/change:
    post:
      operationId: auth_password_change_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/config/lead-options:
    get:
      operationId: lead_options
      description: Statuses, sources, ratings and country codes for lead forms and
        filters.
      tags:
      - config
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadOptions'
          description: ''
  /api/v1/config/pipelines:
    get:
      operationId: pipelines_list
      description: Pipelines and their stages (configuration, the same for everyone).
      tags:
      - config
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineList'
          description: ''
  /api/v1/workspaces/{workspace}:
    get:
      operationId: workspaces_retrieve
      description: |-
        Describe a workspace (whose CRM it is). Opening another user's workspace is
        authorised and audited by resolve_workspace; outside the caller's reach it is 404.
      parameters:
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
        '404':
          description: No response body
  /api/v1/workspaces/{workspace}/activities:
    get:
      operationId: activities_list
      parameters:
      - in: query
        name: archived
        schema:
          type: boolean
          default: false
      - in: query
        name: cancelled
        schema:
          type: boolean
          nullable: true
        description: false leaves cancelled tasks and meetings out; true keeps only
          them.
      - in: query
        name: current
        schema:
          type: boolean
          default: false
        description: Open tasks and scheduled meetings.
      - in: query
        name: cursor
        schema:
          type: string
          minLength: 1
          maxLength: 1000
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: Inclusive business date of the due time / start / creation.
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: Inclusive.
      - in: query
        name: lead
        schema:
          type: string
          format: uuid
      - in: query
        name: opportunity
        schema:
          type: string
          format: uuid
      - in: query
        name: ordering
        schema:
          enum:
          - -created_at
          - -scheduled
          - created_at
          - scheduled
          type: string
          default: -created_at
          minLength: 1
        description: |-
          * `-created_at` - -created_at
          * `-scheduled` - -scheduled
          * `created_at` - created_at
          * `scheduled` - scheduled
      - in: query
        name: overdue
        schema:
          type: boolean
          default: false
      - in: query
        name: owner
        schema:
          type: string
          format: uuid
        description: Organisation-wide workspace only.
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
      - in: query
        name: status
        schema:
          enum:
          - open
          - scheduled
          - completed
          - cancelled
          type: string
          minLength: 1
        description: |-
          * `open` - Open
          * `scheduled` - Scheduled
          * `completed` - Completed
          * `cancelled` - Cancelled
      - in: query
        name: type
        schema:
          enum:
          - task
          - meeting
          - note
          type: string
          minLength: 1
        description: |-
          * `task` - Task
          * `meeting` - Meeting
          * `note` - Note
      - in: query
        name: upcoming
        schema:
          type: boolean
          default: false
        description: Open tasks and scheduled meetings due or starting from now on.
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
          description: ''
        '404':
          description: Not found, or outside this workspace.
    post:
      operationId: activities_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
        description: A UUID chosen by the client. Repeating the same request with
          the same key within 24 hours returns the lead created the first time instead
          of a duplicate.
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityCreateRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
          description: ''
        '404':
          description: Not found, or outside this workspace.
  /api/v1/workspaces/{workspace}/activities/{activity_id}:
    get:
      operationId: activities_retrieve
      parameters:
      - in: path
        name: activity_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
          description: ''
        '404':
          description: Not found, or outside this workspace.
    patch:
      operationId: activities_update
      parameters:
      - in: path
        name: activity_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedActivityUpdateRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
          description: ''
        '404':
          description: Not found, or outside this workspace.
  /api/v1/workspaces/{workspace}/activities/{activity_id}/archive:
    post:
      operationId: activities_archive
      summary: Hide an activity from lists, timelines and counts.
      parameters:
      - in: path
        name: activity_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityVersionRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
          description: ''
        '404':
          description: Not found, or outside this workspace.
  /api/v1/workspaces/{workspace}/activities/{activity_id}/cancel:
    post:
      operationId: activities_cancel
      summary: Cancel a task or a meeting.
      parameters:
      - in: path
        name: activity_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityVersionRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
          description: ''
        '404':
          description: Not found, or outside this workspace.
  /api/v1/workspaces/{workspace}/activities/{activity_id}/complete:
    post:
      operationId: activities_complete
      summary: Complete a task, or record that a meeting took place (updates last
        contact).
      parameters:
      - in: path
        name: activity_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityVersionRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
          description: ''
        '404':
          description: Not found, or outside this workspace.
  /api/v1/workspaces/{workspace}/activities/{activity_id}/reopen:
    post:
      operationId: activities_reopen
      summary: Reopen a completed or cancelled task or meeting (it follows the lead's
        owner).
      parameters:
      - in: path
        name: activity_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityVersionRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
          description: ''
        '404':
          description: Not found, or outside this workspace.
  /api/v1/workspaces/{workspace}/activities/{activity_id}/restore:
    post:
      operationId: activities_restore
      summary: Bring an archived activity back.
      parameters:
      - in: path
        name: activity_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityVersionRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
          description: ''
        '404':
          description: Not found, or outside this workspace.
  /api/v1/workspaces/{workspace}/activity-summary:
    get:
      operationId: activity_summary
      description: |-
        Open tasks, tasks due today, overdue tasks, today's meetings and upcoming meetings in
        this workspace: the authoritative figures (the dashboard will show exactly these).
      parameters:
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivitySummary'
          description: ''
        '404':
          description: Not found, or outside this workspace.
  /api/v1/workspaces/{workspace}/ask:
    get:
      operationId: ask_status
      description: Ask a question about this workspace, or read what Ask Arkray can
        do right now.
      parameters:
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskStatus'
          description: ''
        '404':
          description: Not found, or outside this workspace.
    post:
      operationId: ask
      description: Ask a question about this workspace, or read what Ask Arkray can
        do right now.
      parameters:
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskInputRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
          description: ''
        '404':
          description: Not found, or outside this workspace.
        '429':
          description: Too many questions, or one is still pending.
        '503':
          description: Ask Arkray is turned off or busy.
  /api/v1/workspaces/{workspace}/ask/conversations:
    get:
      operationId: ask_conversations
      description: The caller's most recent conversations in this workspace (at most
        20).
      parameters:
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationSummary'
          description: ''
        '404':
          description: Not found, or outside this workspace.
  /api/v1/workspaces/{workspace}/ask/conversations/{conversation_id}:
    get:
      operationId: ask_conversation
      description: One of the caller's conversations in this workspace, or forget
        it.
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: ''
        '404':
          description: Not found, or outside this workspace.
    delete:
      operationId: ask_conversation_delete
      description: One of the caller's conversations in this workspace, or forget
        it.
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
        '404':
          description: Not found, or outside this workspace.
  /api/v1/workspaces/{workspace}/ask/questions/{question_id}:
    get:
      operationId: ask_question
      description: One of the caller's questions in this workspace (poll until answered
        or failed).
      parameters:
      - in: path
        name: question_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
          description: ''
        '404':
          description: Not found, or outside this workspace.
  /api/v1/workspaces/{workspace}/dashboard:
    get:
      operationId: dashboard
      description: |-
        Total leads, new leads today, pipeline value, weighted pipeline, meetings and tasks in
        this workspace, with today's newest leads, the next meetings and the next open tasks.
      parameters:
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: ''
        '404':
