          readOnly: true
        probability:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/StageCategoryEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - category
