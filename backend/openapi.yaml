      - id
      - organization_name
      - owner
      - status
    SearchLeadGroup:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchLead'
        has_more:
          type: boolean
          description: More leads matched than are shown.
      required:
      - has_more
      - results
    SearchMeeting:
      type: object
