  /api/v1/workspaces/{workspace}/pipeline-board:
    get:
      operationId: pipeline_board
      description: |-
        The Kanban board: every stage of one pipeline with its count, value, weighted value
        and at most `cards_per_stage` cards, plus the open-pipeline totals. Bounded whatever
        the number of opportunities; a column's `next` continues in the opportunities list.
      parameters:
      - in: query
        name: cards_per_stage
        schema:
          type: integer
          maximum: 50
          minimum: 0
          default: 20
      - in: query
        name: expected_close_from
        schema:
          type: string
          format: date
        description: Inclusive.
      - in: query
        name: expected_close_to
        schema:
          type: string
          format: date
        description: Inclusive.
      - in: query
        name: lead
        schema:
          type: string
          format: uuid
      - in: query
        name: owner
        schema:
          type: string
          format: uuid
        description: Organisation-wide workspace only.
      - in: query
        name: pipeline
        schema:
          type: string
          format: uuid
        description: The default pipeline if omitted.
      - in: query
        name: probability_max
        schema:
          oneOf:
          - type: string
            pattern: ^[0-9]+(\.[0-9]{1,2})?$
            example: '1250000.00'
          - type: integer
            minimum: 0
      - in: query
        name: probability_min
        schema:
          oneOf:
          - type: string
            pattern: ^[0-9]+(\.[0-9]{1,2})?$
            example: '1250000.00'
          - type: integer
            minimum: 0
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
          description: ''
        '404':
          description: Not found, or outside this workspace.
  /api/v1/workspaces/{workspace}/pipeline-summary:
    get:
      operationId: pipeline_summary
      description: |-
        Pipeline value, weighted pipeline and the open count in this workspace: the
        authoritative figures (the dashboard shows exactly these).
      parameters:
      - in: query
        name: expected_close_from
        schema:
          type: string
          format: date
        description: Inclusive.
      - in: query
        name: expected_close_to
        schema:
          type: string
          format: date
        description: Inclusive.
      - in: query
        name: lead
        schema:
          type: string
          format: uuid
      - in: query
        name: owner
        schema:
          type: string
          format: uuid
        description: Organisation-wide workspace only.
      - in: query
        name: pipeline
        schema:
          type: string
          format: uuid
        description: Every pipeline if omitted.
      - in: query
        name: probability_max
        schema:
          oneOf:
          - type: string
            pattern: ^[0-9]+(\.[0-9]{1,2})?$
            example: '1250000.00'
          - type: integer
            minimum: 0
      - in: query
        name: probability_min
        schema:
          oneOf:
          - type: string
            pattern: ^[0-9]+(\.[0-9]{1,2})?$
            example: '1250000.00'
          - type: integer
            minimum: 0
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineSummary'
          description: ''
        '404':
          description: Not found, or outside this workspace.
components:
