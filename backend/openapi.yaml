        * `available` - available
        * `unavailable` - unavailable
        * `none` - none
    TimelineActivity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ActivityTypeEnum'
        title:
          type: string
        preview:
          type: string
        preview_truncated:
          type: boolean
        status:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ActivityStatusEnum'
          - $ref: '#/components/schemas/NullEnum'
        due_at:
          type: string
          format: date-time
          nullable: true
        starts_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
