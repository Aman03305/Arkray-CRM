      description: |-
        * `open` - Open
        * `won` - Won
        * `lost` - Lost
    StageHistory:
      type: object
      properties:
        id:
          type: string
          example: 3f9a1c0b7d2e4a6c8e10
          readOnly: true
        from_stage_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        to_stage_id:
          type: string
          format: uuid
          readOnly: true
        from_stage_name:
          type: string
          readOnly: true
        to_stage_name:
          type: string
          readOnly: true
        from_status:
          type: string
          readOnly: true
        to_status:
          allOf:
          - $ref: '#/components/schemas/StageCategoryEnum'
          readOnly: true
        value:
          type: string
          format: decimal
          readOnly: true
        probability:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
        lost_reason:
          type: string
          readOnly: true
        actor:
          allOf:
