          - $ref: '#/components/schemas/NullEnum'
        due_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        is_overdue:
          type: boolean
          readOnly: true
          description: An open task past its due time, or a scheduled meeting past
            its end.
        lead:
          allOf:
          - $ref: '#/components/schemas/ActivityLeadRef'
          readOnly: true
        owner:
          allOf:
          - $ref: '#/components/schemas/UserRef'
          readOnly: true
      required:
      - due_at
      - id
      - is_overdue
      - lead
      - owner
      - priority
      - status
      - title
    SearchTaskGroup:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchTask'
        has_more:
          type: boolean
          description: More tasks matched than are shown.
      required:
      - has_more
      - results
    SourceRef:
      type: object
      properties:
        key:
          type: string
          readOnly: true
