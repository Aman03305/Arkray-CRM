openapi: 3.0.3
info:
  title: Arkray CRM API
  version: 1.0.0
paths:
  /api/v1/admin/users:
    get:
      operationId: admin_users_list
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
          minLength: 1
          maxLength: 500
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: q
        schema:
          oneOf:
          - type: string
            maxLength: 100
            minLength: 2
          - type: string
            maxLength: 0
      - in: query
        name: role
        schema:
          enum:
          - admin
          - sales_user
          type: string
          minLength: 1
        description: |-
          * `admin` - Admin
          * `sales_user` - User
      - in: query
        name: status
        schema:
          enum:
          - invited
          - active
          - deactivated
          type: string
          minLength: 1
        description: |-
          * `invited` - Invited
          * `active` - Active
          * `deactivated` - Deactivated
      tags:
      - admin
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPage'
          description: ''
    post:
      operationId: admin_users_create
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin/users/{user_id}:
    get:
      operationId: admin_users_retrieve
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    patch:
      operationId: admin_users_partial_update
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin/users/{user_id}/activate:
    post:
      operationId: admin_users_activate_create
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin/users/{user_id}/change-email:
    post:
      operationId: admin_users_change_email_create
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin/users/{user_id}/deactivate:
    post:
      operationId: admin_users_deactivate_create
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin/users/{user_id}/resend-invitation:
    post:
      operationId: admin_users_resend_invitation_create
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/assignees:
    get:
      operationId: assignees_list
      description: Who CRM records can be assigned to (owner pickers). Active users
        only, by name.
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
          minLength: 1
          maxLength: 1000
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 100
      - in: query
        name: q
        schema:
          oneOf:
          - type: string
            maxLength: 100
            minLength: 2
          - type: string
            maxLength: 0
      tags:
      - assignees
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssigneePage'
          description: ''
  /api/v1/auth/csrf:
    get:
      operationId: auth_csrf_retrieve
      description: Issue the CSRF cookie the SPA echoes in X-CSRFToken.
      tags:
      - auth
      security:
      - sessionAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/invitations/accept:
    post:
      operationId: auth_invitations_accept_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
        required: true
      security:
      - sessionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
          description: ''
  /api/v1/auth/invitations/verify:
    post:
      operationId: auth_invitations_verify_create
      description: Who a still-valid invitation link is for. POST so the secret never
        enters a URL.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationTokenRequest'
        required: true
      security:
      - sessionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - sessionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Viewer'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      description: 'Ends the session. Idempotent: signing out without a session is
        a no-op.'
      tags:
      - auth
      security:
      - sessionAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/me:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Viewer'
          description: ''
  /api/v1/auth/password-reset:
    post:
      operationId: auth_password_reset_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - sessionAuth: []
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: auth_password_reset_confirm_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - sessionAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/password/change:
    post:
      operationId: auth_password_change_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/config/lead-options:
    get:
      operationId: lead_options
      description: Statuses, sources, ratings and country codes for lead forms and
        filters.
      tags:
      - config
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadOptions'
          description: ''
  /api/v1/config/pipelines:
    get:
      operationId: pipelines_list
      description: Pipelines and their stages (configuration, the same for everyone).
      tags:
      - config
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineList'
          description: ''
  /api/v1/workspaces/{workspace}:
    get:
      operationId: workspaces_retrieve
      description: |-
        Describe a workspace (whose CRM it is). Opening another user's workspace is
        authorised and audited by resolve_workspace; outside the caller's reach it is 404.
      parameters:
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
        '404':
          description: No response body
  /api/v1/workspaces/{workspace}/leads:
    get:
      operationId: leads_list
      parameters:
      - in: query
        name: archived
        schema:
          type: boolean
          default: false
      - in: query
        name: created_from
        schema:
          type: string
          format: date
        description: Inclusive, business time zone.
      - in: query
        name: created_to
        schema:
          type: string
          format: date
        description: Inclusive, business time zone.
      - in: query
        name: cursor
        schema:
          type: string
          minLength: 1
          maxLength: 1000
      - in: query
        name: ordering
        schema:
          enum:
          - -created_at
          - -last_contacted_at
          - -updated_at
          - created_at
          - last_contacted_at
          - name
          type: string
          default: -created_at
          minLength: 1
        description: |-
          * `-created_at` - -created_at
          * `-last_contacted_at` - -last_contacted_at
          * `-updated_at` - -updated_at
          * `created_at` - created_at
          * `last_contacted_at` - last_contacted_at
          * `name` - name
      - in: query
        name: owner
        schema:
          type: string
          format: uuid
        description: Organisation-wide workspace only.
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
      - in: query
        name: q
        schema:
          oneOf:
          - type: string
            maxLength: 100
            minLength: 2
          - type: string
            maxLength: 0
      - in: query
        name: rating
        schema:
          enum:
          - hot
          - warm
          - cold
          type: string
          minLength: 1
        description: |-
          * `hot` - Hot
          * `warm` - Warm
          * `cold` - Cold
      - in: query
        name: source
        schema:
          type: string
          minLength: 1
          maxLength: 32
      - in: query
        name: status
        schema:
          type: string
          minLength: 1
          maxLength: 32
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadPage'
          description: ''
        '404':
          description: Not found, or outside this workspace.
    post:
      operationId: leads_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
        description: A UUID chosen by the client. Repeating the same request with
          the same key within 24 hours returns the lead created the first time instead
          of a duplicate.
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadCreateRequest'
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
          description: ''
        '404':
          description: Not found, or outside this workspace.
  /api/v1/workspaces/{workspace}/leads/{lead_id}:
    get:
      operationId: leads_retrieve
      parameters:
      - in: path
        name: lead_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
          description: ''
        '404':
          description: Not found, or outside this workspace.
    patch:
      operationId: leads_update
      parameters:
      - in: path
        name: lead_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLeadUpdateRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
          description: ''
        '404':
          description: Not found, or outside this workspace.
  /api/v1/workspaces/{workspace}/leads/{lead_id}/archive:
    post:
      operationId: leads_archive
      parameters:
      - in: path
        name: lead_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadVersionRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
          description: ''
        '404':
          description: Not found, or outside this workspace.
  /api/v1/workspaces/{workspace}/leads/{lead_id}/assign:
    post:
      operationId: leads_assign
      description: |-
        Reassign a lead (crm.assign_any). The response shows the lead as reassigned, even if
        it has thereby left the workspace it was reassigned from.
      parameters:
      - in: path
        name: lead_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadAssignRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
          description: ''
        '404':
          description: Not found, or outside this workspace.
  /api/v1/workspaces/{workspace}/leads/{lead_id}/convert:
    post:
      operationId: leads_convert
      description: |-
        Convert a lead: create its opportunity and set the lead's status to Converted, in
        one transaction. Send an Idempotency-Key so a retried request can't convert twice.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
        description: A UUID chosen by the client. Repeating the same request with
          the same key within 24 hours returns the lead created the first time instead
          of a duplicate.
      - in: path
        name: lead_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadConvertRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversion'
          description: ''
        '404':
          description: Not found, or outside this workspace.
  /api/v1/workspaces/{workspace}/leads/{lead_id}/restore:
    post:
      operationId: leads_restore
      parameters:
      - in: path
        name: lead_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadVersionRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
          description: ''
        '404':
          description: Not found, or outside this workspace.
  /api/v1/workspaces/{workspace}/leads/{lead_id}/status:
    post:
      operationId: leads_change_status
      parameters:
      - in: path
        name: lead_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadStatusChangeRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
          description: ''
        '404':
          description: Not found, or outside this workspace.
  /api/v1/workspaces/{workspace}/leads/duplicates:
    get:
      operationId: leads_duplicates
      description: |-
        Possible duplicates of the contact details being entered, within this workspace only
        (never a way to learn about leads the caller can't see). Advisory: nothing is blocked
        or merged.
      parameters:
      - in: query
        name: email
        schema:
          type: string
          maxLength: 254
      - in: query
        name: exclude
        schema:
          type: string
          format: uuid
        description: A lead to leave out (when editing).
      - in: query
        name: phone
        schema:
          type: array
          items:
            type: string
            maxLength: 40
          maxItems: 3
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadDuplicateList'
          description: ''
        '404':
          description: Not found, or outside this workspace.
  /api/v1/workspaces/{workspace}/opportunities:
    get:
      operationId: opportunities_list
      parameters:
      - in: query
        name: archived
        schema:
          type: boolean
          default: false
      - in: query
        name: cursor
        schema:
          type: string
          minLength: 1
          maxLength: 1000
      - in: query
        name: expected_close_from
        schema:
          type: string
          format: date
        description: Inclusive.
      - in: query
        name: expected_close_to
        schema:
          type: string
          format: date
        description: Inclusive.
      - in: query
        name: lead
        schema:
          type: string
          format: uuid
      - in: query
        name: ordering
        schema:
          enum:
          - -closed_at
          - -created_at
          - -updated_at
          - -value
          - created_at
          - expected_close
          - value
          type: string
          default: -created_at
          minLength: 1
        description: |-
          * `-closed_at` - -closed_at
          * `-created_at` - -created_at
          * `-updated_at` - -updated_at
          * `-value` - -value
          * `created_at` - created_at
          * `expected_close` - expected_close
          * `value` - value
      - in: query
        name: owner
        schema:
          type: string
          format: uuid
        description: Organisation-wide workspace only.
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
      - in: query
        name: pipeline
        schema:
          type: string
          format: uuid
      - in: query
        name: probability_max
        schema:
          oneOf:
          - type: string
            pattern: ^[0-9]+(\.[0-9]{1,2})?$
            example: '1250000.00'
          - type: integer
            minimum: 0
      - in: query
        name: probability_min
        schema:
          oneOf:
          - type: string
            pattern: ^[0-9]+(\.[0-9]{1,2})?$
            example: '1250000.00'
          - type: integer
            minimum: 0
      - in: query
        name: stage
        schema:
          type: string
          format: uuid
      - in: query
        name: status
        schema:
          enum:
          - open
          - won
          - lost
          type: string
          minLength: 1
        description: |-
          * `open` - Open
          * `won` - Won
          * `lost` - Lost
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityPage'
          description: ''
        '404':
          description: Not found, or outside this workspace.
    post:
      operationId: opportunities_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
        description: A UUID chosen by the client. Repeating the same request with
          the same key within 24 hours returns the lead created the first time instead
          of a duplicate.
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpportunityCreateRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'
          description: ''
        '404':
          description: Not found, or outside this workspace.
  /api/v1/workspaces/{workspace}/opportunities/{opportunity_id}:
    get:
      operationId: opportunities_retrieve
      parameters:
      - in: path
        name: opportunity_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace
        schema:
          type: string
        required: true
      tags:
      - workspaces
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'
          description: ''
